<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BCW Smart HUB - เข้าสู่ระบบ</title>
    
    <link rel="icon" type="image/png" href="assets/images/logo_bcw.png">
    <link rel="apple-touch-icon" href="assets/images/logo_bcw.png">

    <!-- Font Setup & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- เพิ่มในหน้า login.html ในส่วน <head> -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
     <script>
        // ดักจับทันทีก่อนวาดหน้าจอ: หากกลับมาจาก LINE (?code=...) หรือมี Session เดิม ให้ซ่อนฟอร์มล็อกอิน
        (function() {
            const params = new URLSearchParams(window.location.search);
            const hasLineCode = params.has('code');
            const hasSession = localStorage.getItem('bcw_user_session');
    
            if (hasLineCode || hasSession) {
                document.documentElement.classList.add('bcw-fast-redirect');
            }
        })();
    </script>
    <style>
        /* ซ่อนฟอร์มล็อกอินทันทีเมื่ออยู่ในโหมดกำลังเปลี่ยนหน้า */
        html.bcw-fast-redirect body > *:not(#bcw-loading-overlay) {
            display: none !important;
        }
        #bcw-loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #064e3b 0%, #0f766e 100%);
            color: #ffffff;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            font-family: 'Prompt', sans-serif;
        }
        html.bcw-fast-redirect #bcw-loading-overlay {
            display: flex !important;
        }
        .bcw-spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(255, 255, 255, 0.25);
            border-top-color: #34d399;
            border-radius: 50%;
            animation: bcwSpin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes bcwSpin {
            to { transform: rotate(360deg); }
        }
    </style>   
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif, system-ui; }
        html, body { 
            overflow: hidden !important; 
            width: 100vw; height: 100vh; height: 100dvh; 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            touch-action: none; background-color: #0f172a; 
            display: flex; align-items: center; justify-content: center; padding: 12px; 
        }
        .login-card { 
            width: 100%; max-width: 480px; background: #ffffff; 
            border-radius: 20px; overflow: hidden; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.1); touch-action: auto;
        }
        .card-header { 
            background: linear-gradient(135deg, #064e3b 0%, #047857 50%, #059669 100%); 
            padding: 16px 18px; color: white; display: flex; align-items: center; justify-content: flex-start;
            gap: 14px; border-bottom: 4px solid #facc15; box-shadow: inset 0 -2px 10px rgba(0,0,0,0.15);
        }
        .logo-wrapper {
            width: 60px; height: 60px; background: #ffffff; border-radius: 16px; padding: 5px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25), 0 0 0 2px rgba(250, 204, 21, 0.8); flex-shrink: 0;
        }
        .school-logo { width: 100%; height: 100%; object-fit: contain; }
        .brand-text { display: flex; flex-direction: column; justify-content: center; text-align: left; min-width: 0; }
        .brand-text .line-1 { font-size: 21px; font-weight: 800; line-height: 1.15; color: #facc15; text-shadow: 0 2px 4px rgba(0,0,0,0.3); letter-spacing: 0.5px; white-space: nowrap; }
        .brand-text .line-2-en { font-size: 15px; color: #fef08a; font-weight: 700; letter-spacing: 0.8px; margin: 1px 0; white-space: nowrap; text-transform: uppercase; }
        .brand-text .line-3-th { font-size: 16px; color: #ffffff; font-weight: 600; white-space: nowrap; opacity: 0.95; }
        .card-body { padding: 16px 16px; text-align: center; }
        
        /* ปุ่ม SSO */
        .sso-group { display: flex; flex-direction: column; gap: 10px; }
        .btn-google-sso { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px; background-color: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 10px; cursor: pointer; transition: all 0.2s ease; }
        .btn-google-sso:hover { background-color: #f8fafc; border-color: #059669; }
        .btn-line-login { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 11px; background-color: #06C755; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; transition: all 0.2s ease; }
        .btn-line-login:hover { background-color: #05b34c; }
        
        .google-icon { width: 26px; height: 26px; }
        .btn-text-group { display: flex; flex-direction: column; align-items: flex-start; }
        .main-text { font-size: 15px; font-weight: 700; color: #1e293b; }
        .sub-text { font-size: 13px; color: #64748b; }
        
        .divider { margin: 13px 0; display: flex; align-items: center; color: #64748b; font-size: 13px; font-weight: 600; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #e2e8f0; }
        .divider span { padding: 0 8px; }
        
        .form-group { text-align: left; margin-bottom: 8px; }
        .form-input { 
            width: 100%; padding: 11px 14px; border: 1.5px solid #cbd5e1; 
            border-radius: 10px; font-size: 15px; outline: none; font-weight: 600; 
            background-color: #f8fafc; transition: all 0.2s;
        }
        .form-input:focus { border-color: #059669; background-color: #ffffff; box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15); }
        .btn-submit { width: 100%; padding: 11px; color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 4px; transition: background 0.2s; }
        .btn-emerald { background: #059669; } .btn-emerald:hover { background: #047857; }
    </style>
</head>
<body>
    <div id="bcw-loading-overlay">
        <div class="bcw-spinner"></div>
        <div style="font-size: 18px; font-weight: 600;">กำลังยืนยันตัวตนเข้าสู่ระบบ...</div>
        <div style="font-size: 13px; color: #a7f3d0; margin-top: 4px;">BCW Smart Hub</div>
    </div>
    <div class="login-card">
        <div class="card-header">
            <div class="logo-wrapper">
                <img src="assets/images/logo_bcw.png" alt="โลโก้โรงเรียนบัวเชดวิทยา" class="school-logo" onerror="this.src='https://raw.githubusercontent.com/kruthanadol/BCW-Smart-Hub/main/assets/images/logo_bcw.png'">
            </div>
            <div class="brand-text">
                <div class="line-1">BCW SMART HUB</div>
                <div class="line-2-en">BUACHEDWITTAYA SCHOOL</div>
                <div class="line-3-th">โรงเรียนบัวเชดวิทยา</div>
            </div>
        </div>

        <div class="card-body">
            <!-- 1. Dual-Login SSO Section (Google + LINE) -->
            <div class="sso-group">
                <!-- ปุ่ม Google SSO (ครู / นักเรียน) -->
                <button id="btn-google-login" type="button" class="btn-google-sso" onclick="AuthService.loginWithGoogle()">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="google-icon">
                    <div class="btn-text-group">
                        <span class="main-text">เข้าสู่ระบบด้วย Google</span>
                        <span class="sub-text">สำหรับ นักเรียน / ครู (@buached.ac.th)</span>
                    </div>
                </button>

                <!-- ปุ่ม LINE Login (ผู้ปกครอง / มือถือ) -->
                <button id="btn-line-login" type="button" class="btn-line-login" onclick="AuthService.loginWithLine('YOUR-LIFF-ID')">
                    <i class="fa-brands fa-line text-2xl"></i>
                    <div class="btn-text-group">
                        <span class="main-text text-white">เข้าสู่ระบบด้วย LINE</span>
                        <span class="sub-text text-emerald-100">สำหรับ ผู้ปกครอง / การใช้งานด่วน</span>
                    </div>
                </button>
            </div>

            <div class="divider"><span>หรือ เข้าสู่ระบบด้วยอีเมล / รหัสผ่าน</span></div>

            <!-- 2. Fallback Account Login Form (สำหรับผู้ใช้เดิม) -->
            <form id="account-login-form" onsubmit="handleAccountLogin(event)">
                <div class="form-group">
                    <input type="text" id="account-email" class="form-input" placeholder="✉️ อีเมลโรงเรียน / รหัสประจำตัว" required>
                </div>
                <div class="form-group">
                    <input type="password" id="account-password" class="form-input" placeholder="🔒 รหัสผ่าน" required>
                </div>
                <button type="submit" id="btn-account-submit" class="btn-submit btn-emerald">
                    <i class="fa-solid fa-right-to-bracket mr-1"></i> เข้าสู่ระบบ
                </button>
            </form>
        </div>
    </div>

<!-- 1. CDN Supabase SDK (ต้องอยู่อันดับแรกเสมอ) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Core Engine Scripts -->
<script src="core/supabase-client.js?v=400"></script>
<script src="core/auth-service.js?v=400"></script>
<script src="core/auth-manager.js?v=400"></script>

<script>
    // 🟢 ดักจับและล้าง Error SSO ใน URL ทันทีตั้งแต่โหลดสคริปต์ ป้องกันปัญหา Alert เด้งเตะออก
    if (window.AuthService && typeof AuthService.checkAndCleanUrlError === 'function') {
        AuthService.checkAndCleanUrlError();
    }

    // 🟢 ปุ่มล็อกอินด้วย Google SSO
    function loginWithGoogle() {
        if (window.AuthService && typeof AuthService.loginWithGoogle === 'function') {
            AuthService.loginWithGoogle();
        } else {
            alert('ระบบยังไม่พร้อมใช้งาน กรุณาลองใหม่อีกครั้ง');
        }
    }

    // 🟢 ปุ่มล็อกอินด้วย LINE SSO
    function loginWithLine() {
        if (window.AuthService && typeof AuthService.loginWithLine === 'function') {
            AuthService.loginWithLine();
        } else {
            alert('ระบบยังไม่พร้อมใช้งาน กรุณาลองใหม่อีกครั้ง');
        }
    }

    // 🟢 ดักจับ SSO Listener ทันที ไม่ต้องรอ DOMContentLoaded เพื่อป้องกัน Event ตกหล่น (สำหรับ Google / LINE SSO)
    (function initSSOListener() {
        // หากติด error ใน URL ให้หยุด listener ทันที
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error') || urlParams.has('error_code')) return;

        const checkClient = () => window.supabaseClient || window.db || window.supabase;
        const client = checkClient();

        if (client && client.auth) {
            client.auth.onAuthStateChange(async (event, session) => {
                console.log('Auth State Changed Event:', event);
                if ((event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED' || event === 'INITIAL_SESSION') && session?.user) {
                    if (window.AuthService && !AuthService.isProcessingLogin) {
                        console.log('🔑 SSO สำเร็จ กำลังสกัด Role และย้ายหน้า...');
                        await AuthService.handlePostLogin(session.user);
                    }
                }
            });
        } else {
            // ถ้ายืนยันว่ายังไม่มา ให้รอ 50ms แล้วลองใหม่
            setTimeout(initSSOListener, 50);
        }
    })();

   document.addEventListener('DOMContentLoaded', async () => {
    // 🟢 Step 1: ถ้าผู้ใช้มี Session ค้างใน Storage อยู่แล้ว ให้ย้ายหน้าไปยังบทบาทตนเองทันที
    const currentUser = window.AuthManager ? AuthManager.getCurrentUser() : null;
    if (currentUser && currentUser.role) {
        console.log('พบ Session ค้างอยู่ ดีดไปยังบทบาท:', currentUser.role);
        if (window.AuthService && typeof AuthService.redirectToRolePage === 'function') {
            AuthService.redirectToRolePage(currentUser.role);
            return; // หยุดการทำงานถ้ามี session แล้ว
        }
    }

    // 🟢 Step 2: ผูก Event Submit ของฟอร์ม Direct Login
    const directForm = document.getElementById('directLoginForm') || document.querySelector('form');
    if (directForm) {
        directForm.addEventListener('submit', handleAccountLogin);
    }

    // 🟢 Step 3: ตรวจสอบ LINE Login Callback (กรณีเพิ่งล็อกอินผ่าน LINE กลับมา)
    const urlParams = new URLSearchParams(window.location.search);
    const lineCode = urlParams.get('code');

    if (lineCode) {
        console.log('พบ LINE Authorization Code กำลังดำเนินการยืนยันตัวตน...');
        if (window.AuthService && typeof AuthService.handleLineCallback === 'function') {
            await AuthService.handleLineCallback(lineCode);
        }
    }
});
    // 🟢 Step 3: ฟังก์ชันล็อกอินด้วย อีเมล / รหัสประจำตัว Direct Form (อัปเดตให้รองรับ T001, 13174 และอีเมลจริง)
    async function handleAccountLogin(event) {
        if (event) event.preventDefault();

        const inputVal = document.getElementById('account-email')?.value.trim() || 
                         document.getElementById('usernameInput')?.value.trim() || '';
        const passwordVal = document.getElementById('account-password')?.value.trim() || 
                            document.getElementById('passwordInput')?.value.trim() || '';
        const btnSubmit = document.getElementById('btn-account-submit') || 
                          document.querySelector('button[type="submit"]');

        if (!inputVal || !passwordVal) {
            return alert('กรุณากรอกอีเมล/รหัสประจำตัว และรหัสผ่านให้ครบถ้วน');
        }

        if (btnSubmit) {
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> กำลังตรวจสอบ...';
        }

        try {
            // ล้าง Session เก่าก่อนทำการเข้าสู่ระบบใหม่
            localStorage.removeItem('bcw_user_session');
            sessionStorage.removeItem('bcw_user_session');

            // เรียกใช้ AuthService.loginWithPassword เพื่อให้ค้นหาจากตาราง users / students ตาม Logic รวมศูนย์
            if (window.AuthService && typeof AuthService.loginWithPassword === 'function') {
                await AuthService.loginWithPassword(inputVal, passwordVal);
            } else {
                throw new Error('ไม่พบโมดูล AuthService');
            }
        } catch (err) {
            console.error('Account Login Error:', err);
            // ข้อความแจ้งเตือนถูกจัดการภายใน AuthService.loginWithPassword แล้ว
        } finally {
            if (btnSubmit) {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<i class="fa-solid fa-right-to-bracket mr-1"></i> เข้าสู่ระบบ';
            }
        }
    }
</script>
</body>
</html>
