<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BCW Smart HUB - เข้าสู่ระบบ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', 'Sarabun', sans-serif; }
        html, body { overflow-x: hidden; width: 100%; max-width: 100vw; }
        body { background-color: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 12px; }
        
        /* ปรับขนาดการ์ดให้พอดีกับจอมือถือ ไม่โยกเลื่อนไปมา */
        .login-card { 
            width: 100%; 
            max-width: 480px; 
            background: #ffffff; 
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.15); 
        }
        
        /* Header ยืดความสูง กระชับสมดุล */
        .card-header { 
            background: linear-gradient(135deg, #064e3b 0%, #047857 50%, #059669 100%); 
            padding: 22px 18px; 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            gap: 12px;
            border-bottom: 4px solid #facc15; 
            box-shadow: inset 0 -2px 10px rgba(0,0,0,0.15);
        }
        
        .header-brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
        
        /* โลโก้ชิดซ้าย */
        .logo-wrapper {
            width: 68px;
            height: 68px;
            background: #ffffff;
            border-radius: 16px;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25), 0 0 0 2px rgba(250, 204, 21, 0.85);
            flex-shrink: 0;
        }
        .school-logo { width: 100%; height: 100%; object-fit: contain; }
        
        .brand-text { display: flex; flex-direction: column; justify-content: center; text-align: left; min-width: 0; }
        
        /* บรรทัดที่ 1: BCW SMART HUB ปรับขนาดไม่ให้ล้นตัดคำ */
        .brand-text .line-1 { 
            font-size: 20px; 
            font-weight: 800; 
            line-height: 1.15; 
            color: #facc15; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.3); 
            letter-spacing: 0.2px; 
            white-space: nowrap;
        }
        
        /* บรรทัดที่ 2: โรงเรียนบัวเชดวิทยา */
        .brand-text .line-2 { 
            font-size: 15px; 
            color: #ffffff; 
            font-weight: 600; 
            margin-top: 2px; 
            white-space: nowrap;
        }

        /* คืนสีกรอบและดีไซน์ของตัวอักษร BCW Portal */
        .badge-status { 
            background: rgba(0, 0, 0, 0.35); 
            border: 1.5px solid #facc15;
            color: #fef08a;
            padding: 4px 10px; 
            border-radius: 10px; 
            font-size: 11px; 
            font-weight: 800;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }

        .card-body { padding: 24px 18px; text-align: center; }
        .title { font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
        .subtitle { font-size: 14px; color: #64748b; font-weight: 500; margin-bottom: 20px; }
        
        .btn-google-sso { 
            width: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px; 
            padding: 12px; 
            background-color: #ffffff; 
            border: 2px solid #cbd5e1; 
            border-radius: 14px; 
            cursor: pointer; 
            transition: all 0.2s ease; 
        }
        .btn-google-sso:hover { background-color: #f8fafc; border-color: #059669; transform: translateY(-1px); }
        .google-icon { width: 26px; height: 26px; flex-shrink: 0; }
        .btn-text-group { display: flex; flex-direction: column; align-items: flex-start; text-align: left; }
        
        /* เพิ่มขนาดข้อความปุ่ม Google */
        .main-text { font-size: 15px; font-weight: 800; color: #1e293b; }
        .sub-text { font-size: 12px; color: #475569; font-weight: 600; }
        
        .divider { margin: 20px 0; display: flex; align-items: center; color: #64748b; font-size: 13px; font-weight: 600; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #e2e8f0; }
        .divider span { padding: 0 10px; }
        
        /* ขยายขนาดเนื้อหาฟอร์มด้านล่าง */
        .form-group { text-align: left; margin-bottom: 14px; }
        .form-group label { font-size: 14px; font-weight: 700; color: #1e293b; display: block; margin-bottom: 6px; }
        .form-input { width: 100%; padding: 11px 14px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 15px; outline: none; font-weight: 600; }
        .form-input:focus { border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }
        
        .btn-parent-submit { 
            width: 100%; 
            padding: 13px; 
            background: #0284c7; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-weight: 800; 
            font-size: 15px; 
            cursor: pointer; 
            margin-top: 6px; 
            transition: background 0.2s; 
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.2);
        }
        .btn-parent-submit:hover { background: #0369a1; }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Header มีสีกรอบ BCW Portal และจัดเรียงข้อความพอดีบรรทัด -->
        <div class="card-header">
            <div class="header-brand">
                <div class="logo-wrapper">
                    <img src="assets/images/logo_bcw.png" alt="โลโก้โรงเรียนบัวเชดวิทยา" class="school-logo" onerror="this.src='https://via.placeholder.com/68?text=BCW'">
                </div>
                <div class="brand-text">
                    <div class="line-1">BCW SMART HUB</div>
                    <div class="line-2">โรงเรียนบัวเชดวิทยา</div>
                </div>
            </div>
            <!-- กรอบสีกรอบ BCW Portal คืนกลับมาสมบูรณ์ -->
            <div class="badge-status">BCW Portal</div>
        </div>

        <div class="card-body">
            <h2 class="title">เข้าสู่ระบบ BCW Portal</h2>
            <p class="subtitle">เลือกช่องทางเข้าสู่ระบบตามประเภทผู้ใช้งาน</p>

            <!-- ปุ่ม Google Login สำหรับครู/นักเรียน -->
            <button type="button" id="btn-google-login" class="btn-google-sso">
                <svg class="google-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <div class="btn-text-group">
                    <span class="main-text">เข้าสู่ระบบสำหรับ ครู / นักเรียน</span>
                    <span class="sub-text">ใช้อีเมลองค์กร @buached.ac.th</span>
                </div>
            </button>

            <div class="divider">
                <span>หรือ เข้าใช้งานสำหรับผู้ปกครอง</span>
            </div>

            <form id="parent-login-form">
                <div class="form-group">
                    <label>🆔 เลขประจำตัวนักเรียน</label>
                    <input type="text" id="parent-student-id" class="form-input" placeholder="กรอกรหัสนักเรียน เช่น 12345" required>
                </div>

                <div class="form-group">
                    <label>🔒 รหัสผ่านผู้ปกครอง</label>
                    <input type="password" id="parent-password" class="form-input" placeholder="กรอกรหัสผ่าน" required>
                </div>

                <button type="submit" class="btn-parent-submit">
                    👨‍👩‍👧‍👦 เข้าสู่ระบบสำหรับผู้ปกครอง
                </button>
            </form>
        </div>
    </div>

    <!-- ES Module Integration -->
    <script type="module">
        import { db } from './core/supabase-client.js';

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btn-google-login')?.addEventListener('click', loginWithGoogle);
            document.getElementById('parent-login-form')?.addEventListener('submit', handleParentLogin);
        });

        async function loginWithGoogle() {
            try {
                const { data, error } = await db.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        queryParams: { hd: 'buached.ac.th' },
                        redirectTo: window.location.href.replace(/login\.html.*$/, 'apps/school-app/teacher.html')
                    }
                });
                if (error) throw error;
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อ: ' + err.message);
            }
        }

        async function handleParentLogin(event) {
            event.preventDefault();
            
            const studentId = document.getElementById('parent-student-id').value.trim();
            const password = document.getElementById('parent-password').value.trim();

            try {
                const { data: student, error } = await db
                    .from('students')
                    .select('id, student_id, first_name, last_name, parent_password')
                    .eq('student_id', studentId)
                    .maybeSingle();

                if (error) {
                    console.error('Supabase Error:', error);
                    alert('เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล: ' + error.message);
                    return;
                }

                if (!student) {
                    alert('ไม่พบข้อมูลเลขประจำตัวนักเรียนนี้ในระบบ');
                    return;
                }

                if (student.parent_password === password) {
                    const fullName = (student.first_name && student.last_name) 
                        ? `${student.first_name} ${student.last_name}`
                        : (student.full_name || 'นักเรียน');

                    localStorage.setItem('parent_session', JSON.stringify({
                        role: 'parent',
                        student_id: student.student_id,
                        student_name: fullName
                    }));

                    alert(`ยินดีต้อนรับผู้ปกครองของ ${fullName}`);
                    window.location.href = 'apps/parent-app/parent.html';
                } else {
                    alert('รหัสผ่านไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง');
                }

            } catch (err) {
                console.error(err);
                alert('เกิดข้อผิดพลาดไม่ทราบสาเหตุ: ' + err.message);
            }
        }

        window.loginWithGoogle = loginWithGoogle;
        window.handleParentLogin = handleParentLogin;
    </script>
</body>
</html>
