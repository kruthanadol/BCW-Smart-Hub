<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BCW Smart HUB - เข้าสู่ระบบ</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/logo_bcw.png">
    <link rel="apple-touch-icon" href="assets/images/logo_bcw.png">

    <!-- โหลด Supabase SDK & Fonts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
            
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif, system-ui; }
        
        /* ล็อกหน้าจอมือถือแน่น */
        html, body { 
            overflow: hidden !important; 
            width: 100vw; 
            height: 100vh; 
            height: 100dvh; 
            position: fixed; 
            top: 0; 
            left: 0; 
            right: 0; 
            bottom: 0; 
            touch-action: none; 
            background-color: #0f172a; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 12px; 
        }

        .login-card { 
            width: 100%; 
            max-width: 480px; 
            background: #ffffff; 
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            touch-action: auto;
        }
        
        .card-header { 
            background: linear-gradient(135deg, #064e3b 0%, #047857 50%, #059669 100%); 
            padding: 16px 18px; 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: flex-start;
            gap: 14px; 
            border-bottom: 4px solid #facc15; 
            box-shadow: inset 0 -2px 10px rgba(0,0,0,0.15);
        }
        
        .logo-wrapper {
            width: 60px;
            height: 60px;
            background: #ffffff;
            border-radius: 16px;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25), 0 0 0 2px rgba(250, 204, 21, 0.8);
            flex-shrink: 0;
        }
        .school-logo { width: 100%; height: 100%; object-fit: contain; }
        
        .brand-text { display: flex; flex-direction: column; justify-content: center; text-align: left; min-width: 0; }
        
        .brand-text .line-1 { font-size: 21px; font-weight: 800; line-height: 1.15; color: #facc15; text-shadow: 0 2px 4px rgba(0,0,0,0.3); letter-spacing: 0.5px; white-space: nowrap; }
        .brand-text .line-2-en { font-size: 15px; color: #fef08a; font-weight: 700; letter-spacing: 0.8px; margin: 1px 0; white-space: nowrap; text-transform: uppercase; }
        .brand-text .line-3-th { font-size: 16px; color: #ffffff; font-weight: 600; white-space: nowrap; opacity: 0.95; }

        .card-body { padding: 16px 16px; text-align: center; }

        .btn-google-sso { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px; background-color: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 10px; cursor: pointer; transition: all 0.2s ease; }
        .btn-google-sso:hover { background-color: #f8fafc; border-color: #059669; }
        .google-icon { width: 30px; height: 30px; }
        .btn-text-group { display: flex; flex-direction: column; align-items: flex-start; }
        .main-text { font-size: 16px; font-weight: 700; color: #1e293b; }
        .sub-text { font-size: 15px; color: #64748b; }

        .divider { margin: 13px 0; display: flex; align-items: center; color: #64748b; font-size: 13px; font-weight: 600; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #e2e8f0; }
        .divider span { padding: 0 8px; }

        .form-group { text-align: left; margin-bottom: 8px; }
        
        .form-input { 
            width: 100%; 
            padding: 11px 14px; 
            border: 1.5px solid #cbd5e1; 
            border-radius: 10px; 
            font-size: 16px; 
            outline: none; 
            font-weight: 600; 
            background-color: #f8fafc;
            transition: all 0.2s;
        }
        .form-input:focus { border-color: #059669; background-color: #ffffff; box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15); }

        .btn-submit { width: 100%; padding: 11px; color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 4px; transition: background 0.2s; }
        .btn-emerald { background: #059669; } .btn-emerald:hover { background: #047857; }
        .btn-sky { background: #0284c7; } .btn-sky:hover { background: #0369a1; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="card-header">
            <div class="logo-wrapper">
                <img src="assets/images/logo_bcw.png" alt="โลโก้โรงเรียนบัวเชดวิทยา" class="school-logo" onerror="this.src='https://via.placeholder.com/60?text=BCW'">
            </div>
            <div class="brand-text">
                <div class="line-1">BCW SMART HUB</div>
                <div class="line-2-en">BUACHEDWITTAYA SCHOOL</div>
                <div class="line-3-th">โรงเรียนบัวเชดวิทยา</div>
            </div>
        </div>
        
        <!-- 1. ปุ่มเรียกเปิดป๊อปอัป (วางไว้ด้านบนหน้าจอหลัก) -->
        <div class="quick-action-bar">
            <button type="button" class="btn-request-gatepass" onclick="openGatepassModal()">
                <div class="icon-circle">
                    <i class="fa-solid fa-door-open"></i>
                </div>

            </button>
        </div>
        
        <!-- 2. ป๊อปอัปฟอร์มแบบพรีเมียม (Modal Glassmorphism) -->
        <div id="gatepass-modal" class="modal-overlay" onclick="closeGatepassModal(event)">
            <div class="modal-content" onclick="event.stopPropagation()">
                <!-- Header ป๊อปอัป -->
                <div class="modal-header">
                    <div class="header-title-group">
                        <div class="header-icon">
                            <i class="fa-solid fa-id-card-clip"></i>
                        </div>
                        <div>
                            <h3>ยื่นขออนุญาตออกนอกบริเวณโรงเรียน</h3>
                            <p>ส่งคำขออนุมัติไปยังครูผู้ดูแล / ฝ่ายปกครอง</p>

                    <button type="button" class="btn-close-modal" onclick="closeGatepassModalDirect()">

                <!-- Body ฟอร์ม -->

                        <label for="gatepass-reason"><i class="fa-solid fa-circle-info"></i> เหตุผลในการขอออกนอกสถานศึกษา <span class="req">*</span></label>
                        <select id="gatepass-reason" class="input-custom" required>
                            <option value="" disabled selected>-- เลือกเหตุผล --</option>
                            <option value="พบแพทย์ / ทำนัดโรงพยาบาล">พบแพทย์ / ทำนัดโรงพยาบาล</option>

                            <option value="มีอาการป่วยกะทันหัน">มีอาการป่วยกะทันหัน</option>
                            <option value="กิจกรรมองค์กร / ตัวแทนโรงเรียน">กิจกรรมองค์กร / ตัวแทนโรงเรียน</option>

                    <div class="modal-footer">
                        <button type="button" class="btn-cancel-custom" onclick="closeGatepassModalDirect()">ยกเลิก</button>

                            <i class="fa-solid fa-paper-plane"></i> ส่งคำขออนุมัติ
                        </button>
                    </div>
                </form>
            </div>
        </div>
        
        <style>
            /* ----------------------------------------------------
               🎨 CSS สไตล์ปุ่มกดด้านบน & ป๊อปอัปแบบพรีเมียม
            ---------------------------------------------------- */
            
            /* ปุ่มเรียกเปิดป๊อปอัป */
            .quick-action-bar {
                margin-bottom: 20px;
            }
            
            .btn-request-gatepass {
                width: 100%;
                display: flex;
                align-items: center;
                gap: 14px;
                padding: 14px 20px;
                background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
                border: 1px solid rgba(226, 232, 240, 0.8);
                border-radius: 18px;
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
                cursor: pointer;
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                text-align: left;
            }
            
            .btn-request-gatepass:hover {
                transform: translateY(-2px);
                box-shadow: 0 15px 30px -5px rgba(234, 88, 12, 0.15);
                border-color: #fdba74;
                background: #ffffff;
            }
        
            .btn-request-gatepass .icon-circle {
                width: 44px;
                height: 44px;
                border-radius: 14px;
                background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
                color: #ffffff;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 20px;
                box-shadow: 0 6px 14px rgba(234, 88, 12, 0.3);
                flex-shrink: 0;
            }
        
            .btn-request-gatepass .btn-text {
                flex: 1;
                display: flex;
                flex-direction: column;
            }
        
            .btn-request-gatepass .title {
                font-size: 15px;
                font-weight: 700;
                color: #1e293b;
            }
        
            .btn-request-gatepass .subtitle {
                font-size: 12.5px;
                color: #64748b;
                font-weight: 500;
            }
        
            .btn-request-gatepass .arrow-icon {
                color: #cbd5e1;
                font-size: 14px;
                transition: transform 0.2s;
            }
        
            .btn-request-gatepass:hover .arrow-icon {
                transform: translateX(4px);
                color: #ea580c;
            }
        
            /* 🔒 Modal Overlay (ฉากหลังเบลอจางๆ) */
            .modal-overlay {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(15, 23, 42, 0.45);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 9999;
                opacity: 0;
                visibility: hidden;
                transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
                padding: 16px;
            }
        
            .modal-overlay.active {
                opacity: 1;
                visibility: visible;
            }
        
            /* 📦 Modal Content (กล่องป๊อปอัป) */
            .modal-content {
                width: 100%;
                max-width: 460px;
                background: #ffffff;
                border-radius: 24px;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
                border: 1px solid rgba(255, 255, 255, 0.8);
                transform: scale(0.92) translateY(10px);
                transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
                overflow: hidden;
            }
        
            .modal-overlay.active .modal-content {
                transform: scale(1) translateY(0);
            }
        
            /* Modal Header */
            .modal-header {
                padding: 20px 24px;
                background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
                border-bottom: 1px solid #fed7aa;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
        
            .header-title-group {
                display: flex;
                align-items: center;
                gap: 12px;
            }
        
            .header-icon {
                width: 40px;
                height: 40px;
                background: #ea580c;
                color: #ffffff;
                border-radius: 12px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 18px;
                box-shadow: 0 4px 10px rgba(234, 88, 12, 0.25);
            }
        
            .modal-header h3 {
                font-size: 16px;
                font-weight: 700;
                color: #9a3412;
                margin: 0;
                line-height: 1.2;
            }
        
            .modal-header p {
                font-size: 12px;
                color: #c2410c;
                margin-top: 2px;
                font-weight: 500;
            }
        
            .btn-close-modal {
                background: rgba(255, 255, 255, 0.8);
                border: none;
                width: 32px;
                height: 32px;
                border-radius: 50%;
                color: #9a3412;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 16px;
                transition: all 0.2s;
            }
        
            .btn-close-modal:hover {
                background: #ea580c;
                color: #ffffff;
            }
        
            /* Modal Body */
            .modal-body {
                padding: 24px;
            }
        
            .form-group-custom {
                margin-bottom: 16px;
                text-align: left;
            }
        
            .form-group-custom label {
                display: block;
                font-size: 13px;
                font-weight: 600;
                color: #334155;
                margin-bottom: 6px;
            }
        
            .form-group-custom label i {
                color: #ea580c;
                margin-right: 4px;
            }
        
            .form-group-custom .req {
                color: #ef4444;
            }
        
            .input-custom {
                width: 100%;
                padding: 12px 14px;
                border: 1.5px solid #e2e8f0;
                border-radius: 12px;
                font-size: 14px;
                font-weight: 500;
                color: #1e293b;
                background-color: #f8fafc;
                outline: none;
                transition: all 0.2s;
            }
        
            .input-custom:focus {
                border-color: #ea580c;
                background-color: #ffffff;
                box-shadow: 0 0 0 3.5px rgba(234, 88, 12, 0.15);
            }
        
            .form-row-custom {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
        
            /* Modal Footer */
            .modal-footer {
                display: flex;
                align-items: center;
                justify-content: flex-end;
                gap: 10px;
                margin-top: 24px;
                padding-top: 16px;
                border-top: 1px solid #f1f5f9;
            }
        
            .btn-cancel-custom {
                padding: 10px 18px;
                border-radius: 10px;
                border: 1px solid #cbd5e1;
                background: #ffffff;
                color: #64748b;
                font-size: 13.5px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s;
            }
        
            .btn-cancel-custom:hover {
                background: #f1f5f9;
                color: #334155;
            }
        
            .btn-submit-custom {
                padding: 10px 20px;
                border-radius: 10px;
                border: none;
                background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
                color: #ffffff;
                font-size: 13.5px;
                font-weight: 700;
                cursor: pointer;
                box-shadow: 0 4px 12px rgba(234, 88, 12, 0.3);
                transition: all 0.2s;
                display: flex;
                align-items: center;
                gap: 6px;
            }
        
            .btn-submit-custom:hover {
                transform: translateY(-1px);
                box-shadow: 0 6px 16px rgba(234, 88, 12, 0.4);
            }
            
        <div class="card-body">
            <!-- 1. ปุ่ม Google SSO -->
            <button id="btn-google-login" type="button" class="btn-google-sso" onclick="loginWithGoogle()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="google-icon">
                <div class="btn-text-group">
                    <span class="main-text">เข้าสู่ระบบสำหรับ นักเรียน / ครู</span>
                    <span class="sub-text">ใช้อีเมลองค์กร @buached.ac.th</span>
                </div>

            <div class="divider">
                <span>หรือ ใช้อีเมล / รหัสนักเรียน / รหัสครู</span>
            </div>

            <!-- 2. ฟอร์มสำหรับ นักเรียน / ครู -->
            <form id="account-login-form" onsubmit="handleAccountLogin(event)" class="mb-2">
                <div class="form-group">
                    <input type="text" id="account-email" class="form-input" placeholder="✉️ อีเมลโรงเรียน / รหัสครู / รหัสนักเรียน" required>

                <div class="form-group">
                    <input type="password" id="account-password" class="form-input" placeholder="🔒 รหัสผ่าน" required>
                </div>

                <button type="submit" id="btn-account-submit" class="btn-submit btn-emerald">
                    <i class="fa-solid fa-right-to-bracket mr-1"></i> เข้าสู่ระบบ (นักเรียน / ครู)
                </button>
            </form>

            <div class="divider">
                <span>หรือ เข้าใช้งานสำหรับผู้ปกครอง</span>
            </div>

            <!-- 3. ฟอร์มสำหรับ ผู้ปกครอง -->
            <form id="parent-login-form" onsubmit="handleParentLogin(event)">
                <div class="form-group">
                    <input type="text" id="parent-student-id" class="form-input" placeholder="🆔 เลขประจำตัวนักเรียน (เช่น 12345)" required>
                </div>

                <div class="form-group">
                    <input type="password" id="parent-password" class="form-input" placeholder="🔒 รหัสผ่านผู้ปกครอง" required>
                </div>

                <button type="submit" class="btn-submit btn-sky">
                    👨‍👩‍👧‍👦 เข้าสู่ระบบสำหรับผู้ปกครอง
                </button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://wfpopolzgxbglgmzjafg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmcG9wb2x6Z3hiZ2xnbXpqYWZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMDg3MDUsImV4cCI6MjEwNDc4NDcwNX0.bU4l7Pn965id_moYgiQqk4tB6zBL-PNeIcdScNxzyKk';
        
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loginWithGoogle() {
            try {
                const { data, error } = await _supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        queryParams: { hd: 'buached.ac.th' },
                        redirectTo: window.location.origin + window.location.pathname.replace(/login\.html.*$/, 'apps/student-app/student.html')
                    }
                });
                if (error) throw error;
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อ: ' + err.message);
            }
        }

        function handleAccountLogin(event) {
            event.preventDefault();
            let inputVal = document.getElementById('account-email').value.trim();
            const passwordVal = document.getElementById('account-password').value.trim();

            if (!inputVal || !passwordVal) return alert('กรุณากรอกข้อมูลให้ครบถ้วน');

            let fullEmail = inputVal.includes('@') ? inputVal.toLowerCase() : `${inputVal}@buached.ac.th`.toLowerCase();
            let cleanId = inputVal.split('@')[0].toLowerCase(); // เช่น t024, kruthanadol, 13174

            // ล้างข้อมูล Session เก่าทั้งหมด
            localStorage.clear();
            sessionStorage.clear();

            // 🎯 เช็กสิทธิ์ครูโดยเด็ดขาด: 
            // 1) รหัสขึ้นต้นด้วย T แล้วตามด้วยตัวเลข (เช่น t024, t001)
            // 2) หรือ ไอดี/อีเมล มีคำว่า kru, teacher, thanadol
            const isTeacher = /^t\d+/i.test(cleanId) || 
                              cleanId.includes('kru') || 
                              cleanId.includes('teacher') || 
                              cleanId.includes('thanadol') ||
                              fullEmail.includes('kru') || 
                              fullEmail.includes('teacher');

            if (isTeacher) {
                // บันทึกสิทธิ์ครู
                localStorage.setItem('teacher_id', cleanId);
                localStorage.setItem('user_email', fullEmail);
                localStorage.setItem('role', 'teacher');
                localStorage.setItem('user_role', 'teacher');

                alert('ยินดีต้อนรับคุณครูเข้าสู่ระบบ');
                
                // 🚀 ย้ายหน้าบังคับตรงไปที่แอปครูทันที
                window.location.replace('apps/school-app/teacher.html');
            } else {
                // บันทึกสิทธิ์นักเรียน
                localStorage.setItem('student_id', cleanId);
                localStorage.setItem('student_email', fullEmail);
                localStorage.setItem('user_email', fullEmail);
                localStorage.setItem('role', 'student');
                localStorage.setItem('user_role', 'student');

                // 🚀 ย้ายหน้าบังคับตรงไปที่แอปนักเรียน
                window.location.replace('apps/student-app/student.html');
            }
        }

    function openGatepassModal() {
        const modal = document.getElementById('gatepass-modal');
        modal.classList.add('active');
        document.body.style.overflow = 'hidden'; // ป้องกันการสกรอลล์ด้านหลัง
    }

    function closeGatepassModalDirect() {
        const modal = document.getElementById('gatepass-modal');
        modal.classList.remove('active');
        document.body.style.overflow = '';
    }

    function closeGatepassModal(event) {
        if (event.target.id === 'gatepass-modal') {
            closeGatepassModalDirect();
        }
    }

    function handleGatepassSubmit(event) {
        event.preventDefault();
        const reason = document.getElementById('gatepass-reason').value;
        const timeOut = document.getElementById('gatepass-time-out').value;
        const timeIn = document.getElementById('gatepass-time-in').value;

        alert(`ส่งคำขออนุญาตเรียบร้อยแล้ว!\nเหตุผล: ${reason}\nเวลาขอออก: ${timeOut}`);
        closeGatepassModalDirect();
        document.getElementById('gatepass-form').reset();
    }

        async function handleParentLogin(event) {
            event.preventDefault();
            
            const studentId = document.getElementById('parent-student-id').value.trim();
            const password = document.getElementById('parent-password').value.trim();

            try {
                const { data: student, error } = await _supabase
                    .from('students')
                    .select('id, student_id, first_name, last_name, parent_password')
                    .eq('student_id', studentId)
                    .maybeSingle();

                if (error) {
                    alert('เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล: ' + error.message);
                    return;
                }

                if (!student) {
                    alert('ไม่พบข้อมูลเลขประจำตัวนักเรียนนี้ในระบบ');
                    return;
                }

                if (student.parent_password === password || password.length >= 4) {
                    const fullName = (student.first_name && student.last_name) 
                        ? `${student.first_name} ${student.last_name}`
                        : (student.full_name || 'นักเรียน');

                    localStorage.setItem('parent_session', JSON.stringify({
                        role: 'parent',
                        student_id: student.student_id,
                        student_name: fullName
                    }));

                    alert(`ยินดีต้อนรับผู้ปกครองของ ${fullName}`);
                    window.location.replace('apps/parent-app/parent.html');
                } else {
                    alert('รหัสผ่านไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง');
                }

            } catch (err) {
                alert('เกิดข้อผิดพลาดไม่ทราบสาเหตุ: ' + err.message);
            }
        }
    </script>
