<!DOCTYPE html>
<html lang="th" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>เข้าสู่ระบบ - BCW Smart Hub</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/logo_bcw.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #0f172a; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-4 bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900">

    <!-- Login Container -->
    <div class="w-full max-w-md bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl overflow-hidden border border-white/20 my-auto">
        
        <!-- Header Zone -->
        <div class="bg-gradient-to-r from-indigo-900 to-indigo-800 p-6 sm:p-8 text-center text-white relative">
            <div class="inline-block bg-white p-2 rounded-2xl shadow-lg mb-3">
                <img src="assets/images/logo_bcw.png" alt="BCW Logo" class="w-14 h-14 object-contain" onerror="this.src='https://via.placeholder.com/60'">
            </div>
            <h1 class="text-xl sm:text-2xl font-black tracking-tight">BCW Smart Hub</h1>
            <p class="text-xs text-indigo-200 mt-1">ระบบสารสนเทศ โรงเรียนบัวเชดวิทยา</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="p-6 sm:p-8 space-y-4 text-xs">
            <div>
                <label class="block font-bold text-slate-700 mb-1.5 text-xs">อีเมลโรงเรียน / รหัสนักเรียน <span class="text-rose-500">*</span></label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input type="text" id="emailInput" placeholder="เช่น 13174@buached.ac.th หรือครูผู้สอน" class="w-full pl-10 pr-3 py-3 bg-slate-50 border border-slate-200 rounded-xl font-medium focus:outline-none focus:border-indigo-600 focus:bg-white text-slate-800 transition" required autocomplete="username">
                </div>
            </div>

            <div>
                <label class="block font-bold text-slate-700 mb-1.5 text-xs">รหัสผ่าน <span class="text-rose-500">*</span></label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="passwordInput" placeholder="กรอกรหัสผ่าน..." class="w-full pl-10 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl font-medium focus:outline-none focus:border-indigo-600 focus:bg-white text-slate-800 transition" required autocomplete="current-password">
                    <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600">
                        <i class="fa-solid fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <!-- Error Message Alert -->
            <div id="loginErrorAlert" class="hidden p-3 bg-rose-50 border border-rose-200 rounded-xl text-rose-700 text-[11px] font-bold items-center gap-2">
                <i class="fa-solid fa-circle-exclamation shrink-0 text-sm"></i>
                <span id="errorMessageText">เข้าสู่ระบบไม่สำเร็จ</span>
            </div>

            <button type="submit" id="btnSubmitLogin" class="w-full bg-indigo-700 hover:bg-indigo-800 text-white font-extrabold py-3 rounded-xl shadow-md transition flex items-center justify-center gap-2 text-xs sm:text-sm cursor-pointer mt-2">
                <i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ
            </button>
        </form>

        <div class="bg-slate-50 px-6 py-3 border-t border-slate-100 text-center text-[11px] text-slate-400 font-medium">
            โรงเรียนบัวเชดวิทยา (BCW) &bull; Smart Hub System
        </div>
    </div>

    <!-- Script Handling Login Logic -->
    <script type="module">
        // ค้นหาดึงไฟล์ Supabase Client จาก Path ที่เป็นไปได้ทั้งหมด
        let db = null;
        const possiblePaths = [
            './core/supabase-client.js',
            '../core/supabase-client.js',
            '../../core/supabase-client.js',
            '/core/supabase-client.js'
        ];

        for (const path of possiblePaths) {
            try {
                const module = await import(path);
                if (module.db) {
                    db = module.db;
                    console.log('✅ โหลด Supabase Client สำเร็จจาก:', path);
                    break;
                }
            } catch (e) {}
        }

        document.addEventListener('DOMContentLoaded', () => {
            // ปุ่มแสดง/ซ่อนรหัสผ่าน
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('passwordInput');
            const eyeIcon = document.getElementById('eyeIcon');

            if (togglePassword) {
                togglePassword.addEventListener('click', () => {
                    const isPassword = passwordInput.type === 'password';
                    passwordInput.type = isPassword ? 'text' : 'password';
                    eyeIcon.className = isPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
                });
            }

            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', handleLogin);
            }
        });

        async function handleLogin(e) {
            e.preventDefault();
            
            let emailVal = document.getElementById('emailInput')?.value.trim();
            const passwordVal = document.getElementById('passwordInput')?.value.trim();
            const btnSubmit = document.getElementById('btnSubmitLogin');

            if (!emailVal || !passwordVal) {
                showError('กรุณากรอกอีเมลและรหัสผ่านให้ครบถ้วน');
                return;
            }

            // ถ้านักเรียนกรอกเฉพาะตัวเลขรหัส (เช่น 13174) เติมโดเมนอีเมลให้อัตโนมัติ
            if (!emailVal.includes('@')) {
                emailVal = `${emailVal}@buached.ac.th`;
            }

            try {
                btnSubmit.disabled = true;
                btnSubmit.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> กำลังตรวจสอบข้อมูล...`;
                hideError();

                // เช็กว่าโหลด Supabase db ได้หรือไม่
                if (!db) {
                    throw new Error('ไม่สามารถเชื่อมต่อฐานข้อมูลได้ (ไม่พบไฟล์ supabase-client.js)');
                }

                // 1. ล้าง Session เก่าป้องกันแคชเดิมค้าง
                try {
                    await db.auth.signOut();
                } catch (signOutErr) {}
                localStorage.clear();
                sessionStorage.clear();

                // 2. ล็อกอินผ่าน Supabase Auth
                const { data, error } = await db.auth.signInWithPassword({
                    email: emailVal,
                    password: passwordVal
                });

                if (error) throw error;

                // 3. สกัดรหัสนักเรียน/ผู้ใช้
                const cleanStudentId = emailVal.split('@')[0];

                // 4. บันทึกค่าผู้ใช้ใหม่ลงใน Storage
                localStorage.setItem('student_id', cleanStudentId);
                localStorage.setItem('student_email', emailVal);
                localStorage.setItem('user_email', emailVal);
                localStorage.setItem('user', JSON.stringify(data.user));

                // 5. แยกเส้นทางเข้าใช้งาน (ถ้าระบุสิทธิ์ครูไปหน้าระบบครู / ถ้านักเรียนไปหน้าแอปนักเรียน)
                const userRole = data.user?.user_metadata?.role || localStorage.getItem('role');
                
                if (userRole === 'teacher' || emailVal.includes('teacher') || emailVal.includes('@buached.ac.th') === false) {
                    // กรณีครูผู้สอน
                    window.location.href = 'pages/teacher/index.html';
                } else {
                    // กรณีนักเรียน
                    window.location.href = 'pages/student/student.html';
                }

            } catch (err) {
                console.error('Login Error Details:', err);
                let msg = err.message || 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
                if (err.message.includes('Invalid login credentials')) {
                    msg = 'อีเมลหรือรหัสผ่านไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง';
                }
                showError(msg);
                alert('⚠️ แจ้งเตือน: ' + msg); // Alert ซ้ำเพื่อป้องกันกรณีมองไม่เห็นแถบสีแดง
            } fontFinally: {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ`;
            }
        }

        function showError(msg) {
            const errorAlert = document.getElementById('loginErrorAlert');
            const errorText = document.getElementById('errorMessageText');
            if (errorAlert && errorText) {
                errorText.innerText = msg;
                errorAlert.classList.remove('hidden');
                errorAlert.classList.add('flex');
            }
        }

        function hideError() {
            const errorAlert = document.getElementById('loginErrorAlert');
            if (errorAlert) {
                errorAlert.classList.add('hidden');
                errorAlert.classList.remove('flex');
            }
        }
    </script>
</body>
</html>
