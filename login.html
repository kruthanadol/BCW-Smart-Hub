<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>BCW Smart HUB - เข้าสู่ระบบ</title>
    
    <link rel="icon" type="image/png" href="assets/images/logo_bcw.png">
    <link rel="apple-touch-icon" href="assets/images/logo_bcw.png">

    <!-- Font Setup & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ฉากกั้น Luxury Green-Gold Ring ทำงานทันที 0ms -->
    <script src="core/bcw-page-transition.js?v=5"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif, system-ui; }
        html, body { 
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(180deg, #022c22 0%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom)) 14px;
            -webkit-text-size-adjust: 100%;
        }
        .login-card { 
            width: 100%;
            max-width: 440px;
            background: #ffffff; 
            border-radius: 22px;
            overflow: hidden; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.55); 
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .card-header { 
            background: linear-gradient(135deg, #064e3b 0%, #047857 50%, #059669 100%); 
            padding: 18px 20px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 14px;
            border-bottom: 4px solid #facc15;
            box-shadow: inset 0 -2px 10px rgba(0,0,0,0.15);
        }
        .logo-wrapper {
            width: 62px;
            height: 62px;
            background: #ffffff;
            border-radius: 16px;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25), 0 0 0 2px rgba(250, 204, 21, 0.85);
            flex-shrink: 0;
        }
        .school-logo { width: 100%; height: 100%; object-fit: contain; }
        .brand-text { display: flex; flex-direction: column; justify-content: center; text-align: left; min-width: 0; }
        .brand-text .line-1 { font-size: 22px; font-weight: 800; line-height: 1.2; color: #facc15; text-shadow: 0 2px 4px rgba(0,0,0,0.3); letter-spacing: 0.4px; }
        .brand-text .line-2-en { font-size: 13.5px; color: #fef08a; font-weight: 700; letter-spacing: 0.6px; margin: 2px 0; text-transform: uppercase; }
        .brand-text .line-3-th { font-size: 16px; color: #ffffff; font-weight: 500; opacity: 0.98; }
        .card-body { padding: 18px 18px 20px 18px; text-align: center; }
        
        /* ปุ่ม SSO */
        .sso-group { display: flex; flex-direction: column; gap: 11px; }
        .btn-google-sso {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 14px;
            padding: 12px 16px;
            background-color: #ffffff;
            border: 1.5px solid #cbd5e1;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-google-sso:hover { background-color: #f8fafc; border-color: #059669; }
        .btn-google-sso:active { transform: scale(0.99); }

        .btn-line-login {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 14px;
            padding: 12px 16px;
            background-color: #06C755;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(6, 199, 85, 0.28);
        }
        .btn-line-login:hover { background-color: #05b34c; }
        .btn-line-login:active { transform: scale(0.99); }
        
        .google-icon { width: 28px; height: 28px; flex-shrink: 0; }
        .line-icon-box {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .btn-text-group { display: flex; flex-direction: column; align-items: flex-start; text-align: left; min-width: 0; }
        .main-text { font-size: 16px; font-weight: 600; color: #1e293b; line-height: 1.3; }
        .sub-text { font-size: 13.5px; font-weight: 400; color: #475569; line-height: 1.35; margin-top: 1px; }
        .btn-line-login .main-text { color: #ffffff; }
        .btn-line-login .sub-text { color: rgba(255, 255, 255, 0.95); }
        
        .divider { margin: 15px 0; display: flex; align-items: center; color: #64748b; font-size: 13.5px; font-weight: 500; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #e2e8f0; }
        .divider span { padding: 0 10px; white-space: nowrap; }
        
        .form-group { text-align: left; margin-bottom: 10px; }
        .form-input { 
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1; 
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            font-weight: 400;
            color: #1e293b;
            background-color: #f8fafc;
            transition: all 0.2s;
        }
        .form-input::placeholder { color: #64748b; font-weight: 400; }
        .form-input:focus { border-color: #059669; background-color: #ffffff; box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15); }
        
        .btn-submit {
            width: 100%;
            padding: 13px;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            margin-top: 4px;
            transition: background 0.2s;
        }
        .btn-emerald { background: #059669; }
        .btn-emerald:hover { background: #047857; }
        .btn-emerald:active { transform: scale(0.99); }

        .btn-close-app {
            width: 100%;
            margin-top: 10px;
            padding: 11px;
            border-radius: 12px;
            border: 1.5px solid #cbd5e1;
            background-color: #f1f5f9;
            color: #334155;
            font-size: 14.5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-close-app:hover { background-color: #e2e8f0; }
        .btn-close-app:active { transform: scale(0.99); }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="card-header">
            <div class="logo-wrapper">
                <img src="assets/images/logo_bcw.png" alt="โลโก้โรงเรียนบัวเชดวิทยา" class="school-logo" onerror="this.src='https://raw.githubusercontent.com/kruthanadol/BCW-Smart-Hub/main/assets/images/logo_bcw.png'">
            </div>
            <div class="brand-text">
                <div class="line-1">BCW SMART HUB</div>
                <div class="line-2-en">BUACHEDWITTAYA SCHOOL</div>
                <div class="line-3-th">โรงเรียนบัวเชดวิทยา</div>
            </div>
        </div>

        <div class="card-body">
            <!-- 1. Dual-Login SSO Section (Google + LINE) -->
            <div class="sso-group">
                <button id="btn-google-login" type="button" class="btn-google-sso" onclick="loginWithGoogle()">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="google-icon">
                    <div class="btn-text-group">
                        <span class="main-text">เข้าสู่ระบบด้วย Google</span>
                        <span class="sub-text">สำหรับ นักเรียน / ครู (@buached.ac.th)</span>
                    </div>
                </button>

                <button id="btn-line-login" type="button" class="btn-line-login" onclick="loginWithLine()">
                    <div class="line-icon-box">
                        <i class="fa-brands fa-line text-3xl text-white"></i>
                    </div>
                    <div class="btn-text-group">
                        <span class="main-text">เข้าสู่ระบบด้วย LINE</span>
                        <span class="sub-text">สำหรับ ผู้ปกครอง / การใช้งานด่วน</span>
                    </div>
                </button>
            </div>

            <div class="divider"><span>หรือ เข้าสู่ระบบด้วยอีเมล / รหัสผ่าน</span></div>

            <!-- 2. Fallback Account Login Form -->
            <form id="account-login-form" onsubmit="handleAccountLogin(event)" autocomplete="off">
                <div class="form-group">
                    <input type="text" id="account-email" class="form-input" placeholder="✉️ อีเมลโรงเรียน / รหัสประจำตัว" autocomplete="new-password" required>
                </div>
                <div class="form-group">
                    <input type="password" id="account-password" class="form-input" placeholder="🔒 รหัสผ่าน" autocomplete="new-password" required>
                </div>
                <button type="submit" id="btn-account-submit" class="btn-submit btn-emerald">
                    <i class="fa-solid fa-right-to-bracket mr-1.5"></i> เข้าสู่ระบบ
                </button>
                <button type="button" id="btnCloseAppLogin" onclick="closeAppOrShowExitScreen()" class="btn-close-app">
                    <i class="fa-solid fa-power-off mr-1.5"></i> ปิดหน้าต่าง / ออกจากแอป
                </button>
            </form>
        </div>
    </div>

<!-- 1. CDN Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Core Engine Scripts -->
<script src="core/supabase-client.js?v=400"></script>
<script src="core/auth-service.js?v=400"></script>
<script src="core/auth-manager.js?v=400"></script>

<script>
    if (window.AuthService && typeof AuthService.checkAndCleanUrlError === 'function') {
        AuthService.checkAndCleanUrlError();
    }

    function loginWithGoogle() {
        if (window.showBCWCurtain) window.showBCWCurtain('กำลังเชื่อมต่อ Google SSO...');
        if (window.AuthService && typeof AuthService.loginWithGoogle === 'function') {
            AuthService.loginWithGoogle();
        } else {
            if (window.hideBCWCurtain) window.hideBCWCurtain();
            alert('ระบบยังไม่พร้อมใช้งาน กรุณาลองใหม่อีกครั้ง');
        }
    }

    function loginWithLine() {
        if (window.showBCWCurtain) window.showBCWCurtain('กำลังเชื่อมต่อ LINE Login...');
        if (window.AuthService && typeof AuthService.loginWithLine === 'function') {
            AuthService.loginWithLine('YOUR-LIFF-ID');
        } else {
            if (window.hideBCWCurtain) window.hideBCWCurtain();
            alert('ระบบยังไม่พร้อมใช้งาน กรุณาลองใหม่อีกครั้ง');
        }
    }

    // ฟังก์ชันปิดแอป / ออกจากหน้าต่าง (ไม่เกิด Warning ใน Console)
    function closeAppOrShowExitScreen() {
        if (window.liff && typeof liff.isInClient === 'function' && liff.isInClient()) {
            liff.closeWindow();
            return;
        }
        if (window.matchMedia('(display-mode: standalone)').matches) {
            window.close();
        }
        document.body.innerHTML = `
            <div style="min-height:100dvh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#022c22;color:#fff;font-family:'Kanit',sans-serif;text-align:center;padding:24px;">
                <div style="width:76px;height:76px;border-radius:50%;background:#065f46;border:2px solid #fbbf24;display:flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:16px;">✅</div>
                <h2 style="font-size:22px;font-weight:700;color:#fbbf24;margin:0;">ออกจากระบบเรียบร้อยแล้ว</h2>
                <p style="font-size:15px;color:#a7f3d0;margin-top:8px;">คุณสามารถปัดปิดแอปหรือปิดแท็บเบราว์เซอร์นี้ได้ทันที</p>
                <a href="login.html" style="margin-top:22px;padding:12px 26px;background:#10b981;color:#fff;border-radius:14px;font-size:15px;font-weight:600;text-decoration:none;">เข้าสู่ระบบอีกครั้ง</a>
            </div>
        `;
    }

    // ดักจับ SSO Listener
    (function initSSOListener() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error') || urlParams.has('error_code') || urlParams.has('logout')) return;

        const client = window.supabaseClient || window.db || window.supabase;
        if (client && client.auth) {
            client.auth.onAuthStateChange(async (event, session) => {
                if ((event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED' || event === 'INITIAL_SESSION') && session?.user) {
                    if (window.AuthService && !AuthService.isProcessingLogin) {
                        if (window.showBCWCurtain) window.showBCWCurtain('กำลังเข้าสู่ระบบ...');
                        await AuthService.handlePostLogin(session.user);
                    }
                }
            });
        } else {
            setTimeout(initSSOListener, 50);
        }
    })();

    document.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);

        // ล้างค่า Autofill (T11 / รหัสผ่าน) เมื่อออกจากระบบ
        if (urlParams.has('logout')) {
            const inputs = document.querySelectorAll('#account-email, #account-password');
            inputs.forEach(inp => {
                inp.value = '';
                inp.setAttribute('readonly', 'readonly');
                inp.addEventListener('focus', function unlock() {
                    this.removeAttribute('readonly');
                }, { once: true });
            });
            setTimeout(() => inputs.forEach(inp => { inp.value = ''; }), 400);
            return;
        }

        // ถ้ามี Session ค้างอยู่ ให้ย้ายหน้าไปยังบทบาทตนเองทันที
        const currentUser = window.AuthManager ? AuthManager.getCurrentUser() : null;
        if (currentUser && currentUser.role) {
            if (window.showBCWCurtain) window.showBCWCurtain('กำลังเข้าสู่ระบบอัตโนมัติ...');
            if (window.AuthService && typeof AuthService.redirectToRolePage === 'function') {
                AuthService.redirectToRolePage(currentUser.role);
                return;
            }
        }

        // ตรวจสอบ LINE Login Callback
        const lineCode = urlParams.get('code');
        if (lineCode && window.AuthService && typeof AuthService.handleLineCallback === 'function') {
            if (window.showBCWCurtain) window.showBCWCurtain('กำลังยืนยันตัวตนผ่าน LINE...');
            await AuthService.handleLineCallback(lineCode);
        }
    });

    // ล็อกอินด้วย อีเมล / รหัสประจำตัว
    async function handleAccountLogin(event) {
        if (event) event.preventDefault();

        const inputVal = document.getElementById('account-email')?.value.trim() || '';
        const passwordVal = document.getElementById('account-password')?.value.trim() || '';
        const btnSubmit = document.getElementById('btn-account-submit');

        if (!inputVal || !passwordVal) {
            return alert('กรุณากรอกอีเมล/รหัสประจำตัว และรหัสผ่านให้ครบถ้วน');
        }

        if (window.showBCWCurtain) window.showBCWCurtain('กำลังยืนยันตัวตนเข้าสู่ระบบ...');
        if (btnSubmit) {
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i> กำลังตรวจสอบ...';
        }

        try {
            localStorage.removeItem('bcw_user_session');
            sessionStorage.removeItem('bcw_user_session');

            if (window.AuthService && typeof AuthService.loginWithPassword === 'function') {
                await AuthService.loginWithPassword(inputVal, passwordVal);
            } else {
                throw new Error('ไม่พบโมดูล AuthService');
            }
        } catch (err) {
            console.error('Account Login Error:', err);
            if (window.hideBCWCurtain) window.hideBCWCurtain();
        } finally {
            if (btnSubmit) {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<i class="fa-solid fa-right-to-bracket mr-1.5"></i> เข้าสู่ระบบ';
            }
        }
    }
</script>
</body>
</html>
