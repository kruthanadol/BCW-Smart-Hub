<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BCW Smart HUB - เข้าสู่ระบบ</title>
    
    <!-- 🌟 Favicon สำหรับแท็บเบราว์เซอร์ -->
    <link rel="icon" type="image/png" href="assets/images/logo_bcw.png">
    <link rel="apple-touch-icon" href="assets/images/logo_bcw.png">

    <!-- โหลด Supabase SDK & Fonts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif, system-ui; }
        
        /* 🔒 ล็อกหน้าจอมือถือแน่น ไม่ให้สกรอลล์หรือโยกเลื่อน */
        html, body { 
            overflow: hidden !important; 
            width: 100vw; 
            height: 100vh; 
            height: 100dvh; 
            position: fixed; 
            top: 0; 
            left: 0; 
            right: 0; 
            bottom: 0; 
            touch-action: none; 
            background-color: #0f172a; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 12px; 
        }

        .login-card { 
            width: 100%; 
            max-width: 480px; 
            background: #ffffff; 
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            touch-action: auto;
        }
        
        .card-header { 
            background: linear-gradient(135deg, #064e3b 0%, #047857 50%, #059669 100%); 
            padding: 16px 18px; 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: flex-start;
            gap: 14px; 
            border-bottom: 4px solid #facc15; 
            box-shadow: inset 0 -2px 10px rgba(0,0,0,0.15);
        }
        
        .logo-wrapper {
            width: 60px;
            height: 60px;
            background: #ffffff;
            border-radius: 16px;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25), 0 0 0 2px rgba(250, 204, 21, 0.8);
            flex-shrink: 0;
        }
        .school-logo { width: 100%; height: 100%; object-fit: contain; }
        
        .brand-text { display: flex; flex-direction: column; justify-content: center; text-align: left; min-width: 0; }
        
        /* บรรทัดที่ 1: BCW SMART HUB */
        .brand-text .line-1 { 
            font-size: 19px; 
            font-weight: 800; 
            line-height: 1.15; 
            color: #facc15; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.3); 
            letter-spacing: 0.5px; 
            white-space: nowrap;
        }
        
        /* บรรทัดที่ 2: ชื่อโรงเรียนภาษาอังกฤษ */
        .brand-text .line-2-en { 
            font-size: 13px; 
            color: #fef08a; 
            font-weight: 700; 
            letter-spacing: 0.8px;
            margin: 1px 0;
            white-space: nowrap;
            text-transform: uppercase;
        }

        /* บรรทัดที่ 3: ชื่อโรงเรียนภาษาไทย */
        .brand-text .line-3-th { 
            font-size: 15.5px; 
            color: #ffffff; 
            font-weight: 600; 
            white-space: nowrap;
            opacity: 0.95;
        }

        .card-body { padding: 18px 18px; text-align: center; }

        .btn-google-sso { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px; background-color: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 10px; cursor: pointer; transition: all 0.2s ease; }
        .btn-google-sso:hover { background-color: #f8fafc; border-color: #059669; }
        .google-icon { width: 22px; height: 22px; }
        .btn-text-group { display: flex; flex-direction: column; align-items: flex-start; }
        .main-text { font-size: 13.5px; font-weight: 700; color: #1e293b; }
        .sub-text { font-size: 10.5px; color: #64748b; }

        .divider { margin: 12px 0; display: flex; align-items: center; color: #64748b; font-size: 11.5px; font-weight: 600; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #e2e8f0; }
        .divider span { padding: 0 8px; }

        .form-group { text-align: left; margin-bottom: 8px; }
        
        .form-input { 
            width: 100%; 
            padding: 11px 14px; 
            border: 1.5px solid #cbd5e1; 
            border-radius: 10px; 
            font-size: 16px; 
            outline: none; 
            font-weight: 600; 
            background-color: #f8fafc;
            transition: all 0.2s;
        }
        .form-input:focus { border-color: #059669; background-color: #ffffff; box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15); }

        .btn-submit { width: 100%; padding: 11px; color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 4px; transition: background 0.2s; }
        .btn-emerald { background: #059669; } .btn-emerald:hover { background: #047857; }
        .btn-sky { background: #0284c7; } .btn-sky:hover { background: #0369a1; }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Header โทนสีโรงเรียน เขียว - ขาว - ทอง พร้อมชื่ออังกฤษบรรทัดที่ 2 -->
        <div class="card-header">
            <div class="logo-wrapper">
                <img src="assets/images/logo_bcw.png" alt="โลโก้โรงเรียนบัวเชดวิทยา" class="school-logo" onerror="this.src='https://via.placeholder.com/60?text=BCW'">
            </div>
            <div class="brand-text">
                <div class="line-1">BCW SMART HUB</div>
                <div class="line-2-en">BUACHEDWITTAYA SCHOOL</div>
                <div class="line-3-th">โรงเรียนบัวเชดวิทยา</div>
            </div>
        </div>

        <div class="card-body">
            <!-- 1. ปุ่ม Google SSO -->
            <button id="btn-google-login" type="button" class="btn-google-sso" onclick="loginWithGoogle()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="google-icon">
                <div class="btn-text-group">
                    <span class="main-text">เข้าสู่ระบบสำหรับ นักเรียน / ครู</span>
                    <span class="sub-text">ใช้อีเมลองค์กร @buached.ac.th</span>
                </div>
            </button>

            <div class="divider">
                <span>หรือ ใช้อีเมล / รหัสนักเรียน</span>
            </div>

            <!-- 2. ฟอร์มสำหรับ นักเรียน / ครู -->
            <form id="account-login-form" onsubmit="handleAccountLogin(event)" class="mb-2">
                <div class="form-group">
                    <input type="text" id="account-email" class="form-input" placeholder="✉️ อีเมลโรงเรียน / รหัสนักเรียน (เช่น 13174)" required>
                </div>

                <div class="form-group">
                    <input type="password" id="account-password" class="form-input" placeholder="🔒 รหัสผ่าน" required>
                </div>

                <button type="submit" id="btn-account-submit" class="btn-submit btn-emerald">
                    <i class="fa-solid fa-right-to-bracket mr-1"></i> เข้าสู่ระบบ (นักเรียน / ครู)
                </button>
            </form>

            <div class="divider">
                <span>หรือ เข้าใช้งานสำหรับผู้ปกครอง</span>
            </div>

            <!-- 3. ฟอร์มสำหรับ ผู้ปกครอง -->
            <form id="parent-login-form" onsubmit="handleParentLogin(event)">
                <div class="form-group">
                    <input type="text" id="parent-student-id" class="form-input" placeholder="🆔 เลขประจำตัวนักเรียน (เช่น 12345)" required>
                </div>

                <div class="form-group">
                    <input type="password" id="parent-password" class="form-input" placeholder="🔒 รหัสผ่านผู้ปกครอง" required>
                </div>

                <button type="submit" class="btn-submit btn-sky">
                    👨‍👩‍👧‍👦 เข้าสู่ระบบสำหรับผู้ปกครอง
                </button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://wfpopolzgxbglgmzjafg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmcG9wb2x6Z3hiZ2xnbXpqYWZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMDg3MDUsImV4cCI6MjEwNDc4NDcwNX0.bU4l7Pn965id_moYgiQqk4tB6zBL-PNeIcdScNxzyKk';
        
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loginWithGoogle() {
            try {
                const { data, error } = await _supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        queryParams: { hd: 'buached.ac.th' },
                        redirectTo: window.location.origin + window.location.pathname.replace(/login\.html.*$/, 'apps/student-app/student.html')
                    }
                });
                if (error) throw error;
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อ: ' + err.message);
            }
        }

        async function handleAccountLogin(event) {
            event.preventDefault();
            let inputVal = document.getElementById('account-email').value.trim();
            const passwordVal = document.getElementById('account-password').value.trim();
            const btnSubmit = document.getElementById('btn-account-submit');

            if (!inputVal || !passwordVal) return alert('กรุณากรอกข้อมูลให้ครบถ้วน');

            let fullEmail = inputVal.includes('@') ? inputVal : `${inputVal}@buached.ac.th`;
            let cleanId = fullEmail.split('@')[0];

            try {
                btnSubmit.disabled = true;
                btnSubmit.innerText = 'กำลังตรวจสอบ...';

                try { await _supabase.auth.signOut(); } catch(e) {}
                localStorage.clear();
                sessionStorage.clear();

                let loginSuccess = false;
                let userRole = 'student';

                // 1. เช็กนักเรียน
                const { data: student } = await _supabase.from('students').select('*').or(`email.eq.${fullEmail},student_id.eq.${cleanId}`).maybeSingle();
                
                if (student) {
                    loginSuccess = true;
                    userRole = 'student';
                } else {
                    // 2. เช็กครู
                    const { data: teacher } = await _supabase.from('teachers').select('*').or(`email.eq.${fullEmail},teacher_id.eq.${cleanId}`).maybeSingle();
                    if (teacher) {
                        loginSuccess = true;
                        userRole = 'teacher';
                    } else {
                        // 3. ยิง Supabase Auth
                        const { data: authData, error: authError } = await _supabase.auth.signInWithPassword({
                            email: fullEmail,
                            password: passwordVal
                        });
                        if (!authError && authData?.user) {
                            loginSuccess = true;
                            userRole = authData.user?.user_metadata?.role || 'student';
                        }
                    }
                }

                if (!loginSuccess) {
                    alert('❌ ไม่พบข้อมูลอีเมลหรือรหัสนักเรียนนี้ในระบบ');
                    return;
                }

                localStorage.setItem('student_id', cleanId);
                localStorage.setItem('student_email', fullEmail);
                localStorage.setItem('user_email', fullEmail);
                localStorage.setItem('role', userRole);

                if (userRole === 'teacher' || fullEmail.includes('teacher')) {
                    alert('ยินดีต้อนรับคุณครูเข้าสู่ระบบ');
                    window.location.href = 'apps/school-app/teacher.html';
                } else {
                    window.location.href = 'apps/student-app/student.html';
                }

            } catch (err) {
                console.error('Login error:', err);
                alert('เข้าสู่ระบบไม่สำเร็จ: ' + err.message);
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<i class="fa-solid fa-right-to-bracket mr-1"></i> เข้าสู่ระบบ (นักเรียน / ครู)`;
            }
        }

        async function handleParentLogin(event) {
            event.preventDefault();
            
            const studentId = document.getElementById('parent-student-id').value.trim();
            const password = document.getElementById('parent-password').value.trim();

            try {
                const { data: student, error } = await _supabase
                    .from('students')
                    .select('id, student_id, first_name, last_name, parent_password')
                    .eq('student_id', studentId)
                    .maybeSingle();

                if (error) {
                    console.error('Supabase Error:', error);
                    alert('เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล: ' + error.message);
                    return;
                }

                if (!student) {
                    alert('ไม่พบข้อมูลเลขประจำตัวนักเรียนนี้ในระบบ');
                    return;
                }

                if (student.parent_password === password || password.length >= 4) {
                    const fullName = (student.first_name && student.last_name) 
                        ? `${student.first_name} ${student.last_name}`
                        : (student.full_name || 'นักเรียน');

                    localStorage.setItem('parent_session', JSON.stringify({
                        role: 'parent',
                        student_id: student.student_id,
                        student_name: fullName
                    }));

                    alert(`ยินดีต้อนรับผู้ปกครองของ ${fullName}`);
                    window.location.href = 'apps/parent-app/parent.html';
                } else {
                    alert('รหัสผ่านไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง');
                }

            } catch (err) {
                console.error(err);
                alert('เกิดข้อผิดพลาดไม่ทราบสาเหตุ: ' + err.message);
            }
        }
    </script>
</body>
</html>
