<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCW Smart HUB - เข้าสู่ระบบ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif, system-ui; }
        body { background-color: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { width: 100%; max-width: 490px; background: #ffffff; border-radius: 20px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* Header */
        .card-header { 
            background: linear-gradient(135deg, #064e3b 0%, #047857 50%, #059669 100%); 
            padding: 24px 26px; 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border-bottom: 4px solid #facc15; 
            box-shadow: inset 0 -2px 10px rgba(0,0,0,0.15);
        }
        .header-brand { display: flex; align-items: center; gap: 16px; }
        
        .logo-wrapper {
            width: 70px;
            height: 70px;
            background: #ffffff;
            border-radius: 18px;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25), 0 0 0 2px rgba(250, 204, 21, 0.8);
            flex-shrink: 0;
        }
        .school-logo { width: 100%; height: 100%; object-fit: contain; }
        
        .brand-text h1 { font-size: 20px; font-weight: 800; line-height: 1.1; color: #facc15; text-shadow: 0 2px 4px rgba(0,0,0,0.3); letter-spacing: 0.5px; }
        .brand-text p { font-size: 14px; color: #ffffff; font-weight: 600; margin-top: 3px; opacity: 0.95; }
        
        .badge-status { 
            background: rgba(0, 0, 0, 0.25); 
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fef08a;
            padding: 5px 12px; 
            border-radius: 10px; 
            font-size: 11px; 
            font-weight: 700;
            white-space: nowrap;
        }

        .card-body { padding: 28px 24px; text-align: center; }
        .title { font-size: 22px; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
        .subtitle { font-size: 13px; color: #64748b; margin-bottom: 20px; }
        .btn-google-sso { width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px; background-color: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; }
        .btn-google-sso:hover { background-color: #f8fafc; border-color: #94a3b8; transform: translateY(-1px); }
        .google-icon { width: 24px; height: 24px; }
        .btn-text-group { display: flex; flex-direction: column; align-items: flex-start; }
        .main-text { font-size: 14px; font-weight: 700; color: #1e293b; }
        .sub-text { font-size: 11px; color: #64748b; }
        .divider { margin: 20px 0; display: flex; align-items: center; color: #94a3b8; font-size: 12px; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #e2e8f0; }
        .divider span { padding: 0 10px; font-weight: 500; }
        .form-group { text-align: left; margin-bottom: 12px; }
        .form-group label { font-size: 12px; font-weight: 600; color: #334155; display: block; margin-bottom: 4px; }
        .form-input { width: 100%; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
        .form-input:focus { border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }
        .btn-parent-submit { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 6px; transition: background 0.2s; }
        .btn-parent-submit:hover { background: #0369a1; }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Header -->
        <div class="card-header">
            <div class="header-brand">
                <div class="logo-wrapper">
                    <img src="assets/images/logo_bcw.png" alt="โลโก้โรงเรียนบัวเชดวิทยา" class="school-logo" onerror="this.src='https://via.placeholder.com/70?text=BCW'">
                </div>
                <div class="brand-text">
                    <h1>BCW SMART HUB</h1>
                    <p>โรงเรียนบัวเชดวิทยา</p>
                </div>
            </div>
            <div class="badge-status">BCW Portal</div>
        </div>

        <div class="card-body">
            <h2 class="title">เข้าสู่ระบบ BCW Portal</h2>
            <p class="subtitle">เลือกช่องทางเข้าสู่ระบบตามประเภทผู้ใช้งาน</p>

            <button id="btn-google-login" type="button" class="btn-google-sso">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="google-icon">
                <div class="btn-text-group">
                    <span class="main-text">เข้าสู่ระบบสำหรับ ครู / นักเรียน</span>
                    <span class="sub-text">ใช้อีเมลองค์กร @buached.ac.th</span>
                </div>
            </button>

            <div class="divider">
                <span>หรือ เข้าใช้งานสำหรับผู้ปกครอง</span>
            </div>

            <form id="parent-login-form">
                <div class="form-group">
                    <label>🆔 เลขประจำตัวนักเรียน</label>
                    <input type="text" id="parent-student-id" class="form-input" placeholder="กรอกรหัสนักเรียน เช่น 12345" required>
                </div>

                <div class="form-group">
                    <label>🔒 รหัสผ่านผู้ปกครอง</label>
                    <input type="password" id="parent-password" class="form-input" placeholder="กรอกรหัสผ่าน" required>
                </div>

                <button type="submit" class="btn-parent-submit">
                    👨‍👩‍👧‍👦 เข้าสู่ระบบสำหรับผู้ปกครอง
                </button>
            </form>
        </div>
    </div>

    <!-- ES Module Integration -->
    <script type="module">
        import { db, supabase } from './core/supabase-client.js';

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btn-google-login')?.addEventListener('click', loginWithGoogle);
            document.getElementById('parent-login-form')?.addEventListener('submit', handleParentLogin);
        });

        async function loginWithGoogle() {
            try {
                const { data, error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        queryParams: { hd: 'buached.ac.th' },
                        redirectTo: window.location.origin + '/landing.html'
                    }
                });
                if (error) throw error;
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อ: ' + err.message);
            }
        }

        async function handleParentLogin(event) {
            event.preventDefault();
            
            const studentId = document.getElementById('parent-student-id').value.trim();
            const password = document.getElementById('parent-password').value.trim();

            try {
                const { data: student, error } = await db
                    .from('students')
                    .select('id, student_id, first_name, last_name, parent_password')
                    .eq('student_id', studentId)
                    .maybeSingle();

                if (error) {
                    console.error('Supabase Error:', error);
                    alert('เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล: ' + error.message);
                    return;
                }

                if (!student) {
                    alert('ไม่พบข้อมูลเลขประจำตัวนักเรียนนี้ในระบบ');
                    return;
                }

                if (student.parent_password === password) {
                    const fullName = (student.first_name && student.last_name) 
                        ? `${student.first_name} ${student.last_name}`
                        : (student.full_name || 'นักเรียน');

                    localStorage.setItem('parent_session', JSON.stringify({
                        role: 'parent',
                        student_id: student.student_id,
                        student_name: fullName
                    }));

                    alert(`ยินดีต้อนรับผู้ปกครองของ ${fullName}`);
                    window.location.href = 'apps/parent-app/parent.html';
                } else {
                    alert('รหัสผ่านไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง');
                }

            } catch (err) {
                console.error(err);
                alert('เกิดข้อผิดพลาดไม่ทราบสาเหตุ: ' + err.message);
            }
        }
    </script>
</body>
</html>
