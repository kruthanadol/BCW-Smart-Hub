<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>BCW Smart HUB - เข้าสู่ระบบ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif, system-ui; }
        body { background-color: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 8px; }
        @media (min-width: 640px) { body { padding: 24px; } }

        .login-card { 
            width: 100%; 
            max-width: 520px; 
            background: #ffffff; 
            border-radius: 24px; 
            overflow: hidden; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.15); 
        }
        
        /* Header Responsive & Scaled Up */
        .card-header { 
            background: linear-gradient(135deg, #064e3b 0%, #047857 50%, #059669 100%); 
            padding: 20px 20px; 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border-bottom: 5px solid #facc15; 
            box-shadow: inset 0 -2px 10px rgba(0,0,0,0.15);
            gap: 12px;
        }
        @media (min-width: 640px) {
            .card-header { padding: 26px 28px; }
        }

        .header-brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
        
        .logo-wrapper {
            width: 64px;
            height: 64px;
            background: #ffffff;
            border-radius: 16px;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25), 0 0 0 2.5px rgba(250, 204, 21, 0.9);
            flex-shrink: 0;
        }
        @media (min-width: 640px) {
            .logo-wrapper { width: 72px; height: 72px; border-radius: 18px; padding: 6px; }
        }
        .school-logo { width: 100%; height: 100%; object-fit: contain; }
        
        .brand-text h1 { font-size: 20px; font-weight: 800; line-height: 1.1; color: #facc15; text-shadow: 0 2px 4px rgba(0,0,0,0.3); letter-spacing: 0.5px; }
        .brand-text p { font-size: 14px; color: #ffffff; font-weight: 700; margin-top: 2px; opacity: 0.95; }
        @media (min-width: 640px) {
            .brand-text h1 { font-size: 23px; }
            .brand-text p { font-size: 15px; }
        }
        
        .badge-status { 
            background: rgba(0, 0, 0, 0.3); 
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fef08a;
            padding: 6px 12px; 
            border-radius: 10px; 
            font-size: 12px; 
            font-weight: 800;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .card-body { padding: 26px 20px; text-align: center; }
        @media (min-width: 640px) {
            .card-body { padding: 32px 28px; }
        }

        .title { font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
        .subtitle { font-size: 14px; color: #64748b; font-weight: 500; margin-bottom: 22px; }
        @media (min-width: 640px) {
            .title { font-size: 25px; }
            .subtitle { font-size: 15px; margin-bottom: 24px; }
        }

        .btn-google-sso { 
            width: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px; 
            padding: 14px 16px; 
            background-color: #ffffff; 
            border: 2px solid #cbd5e1; 
            border-radius: 16px; 
            cursor: pointer; 
            transition: all 0.2s ease; 
        }
        .btn-google-sso:hover { background-color: #f8fafc; border-color: #059669; transform: translateY(-1px); }
        .google-icon { width: 28px; height: 28px; flex-shrink: 0; }
        .btn-text-group { display: flex; flex-direction: column; align-items: flex-start; text-align: left; }
        .main-text { font-size: 15px; font-weight: 800; color: #0f172a; }
        .sub-text { font-size: 12px; color: #64748b; font-weight: 500; }
        @media (min-width: 640px) {
            .main-text { font-size: 16px; }
            .sub-text { font-size: 12.5px; }
            .google-icon { width: 30px; height: 30px; }
        }

        .divider { margin: 22px 0; display: flex; align-items: center; color: #64748b; font-size: 13px; font-weight: 600; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #cbd5e1; }
        .divider span { padding: 0 10px; }

        .form-group { text-align: left; margin-bottom: 16px; }
        .form-group label { font-size: 14px; font-weight: 800; color: #1e293b; display: block; margin-bottom: 6px; }
        .form-input { 
            width: 100%; 
            padding: 14px 16px; 
            border: 2px solid #cbd5e1; 
            border-radius: 14px; 
            font-size: 15px; 
            font-weight: 500;
            outline: none; 
            transition: border 0.2s; 
        }
        .form-input:focus { border-color: #0284c7; box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15); }

        .btn-parent-submit { 
            width: 100%; 
            padding: 14px; 
            background: #0284c7; 
            color: white; 
            border: none; 
            border-radius: 14px; 
            font-weight: 800; 
            font-size: 15px; 
            cursor: pointer; 
            margin-top: 8px; 
            transition: background 0.2s; 
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }
        .btn-parent-submit:hover { background: #0369a1; }
        @media (min-width: 640px) {
            .form-input, .btn-parent-submit { font-size: 16px; padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Header -->
        <div class="card-header">
            <div class="header-brand">
                <div class="logo-wrapper">
                    <img src="assets/images/logo_bcw.png" alt="โลโก้โรงเรียนบัวเชดวิทยา" class="school-logo" onerror="this.src='https://via.placeholder.com/70?text=BCW'">
                </div>
                <div class="brand-text">
                    <h1>BCW SMART HUB</h1>
                    <p>โรงเรียนบัวเชดวิทยา</p>
                </div>
            </div>
            <div class="badge-status">BCW Portal</div>
        </div>

        <div class="card-body">
            <h2 class="title">เข้าสู่ระบบ BCW Portal</h2>
            <p class="subtitle">เลือกช่องทางเข้าสู่ระบบตามประเภทผู้ใช้งาน</p>

            <!-- ปุ่ม Google SSO ล็อกอินครู / นักเรียน -->
            <button id="btn-google-login" type="button" class="btn-google-sso">
                <svg class="google-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <div class="btn-text-group">
                    <span class="main-text">เข้าสู่ระบบด้วย Google SSO</span>
                    <span class="sub-text">สำหรับครูผู้สอนและนักเรียน (@buached.ac.th)</span>
                </div>
            </button>

            <div class="divider">
                <span>หรือ เข้าใช้งานสำหรับผู้ปกครอง</span>
            </div>

            <!-- ฟอร์มล็อกอินผู้ปกครอง -->
            <form id="parent-login-form">
                <div class="form-group">
                    <label>🆔 เลขประจำตัวนักเรียน</label>
                    <input type="text" id="parent-student-id" class="form-input" placeholder="กรอกรหัสนักเรียน เช่น 12345" required>
                </div>

                <div class="form-group">
                    <label>🔒 รหัสผ่านผู้ปกครอง</label>
                    <input type="password" id="parent-password" class="form-input" placeholder="กรอกรหัสผ่าน" required>
                </div>

                <button type="submit" class="btn-parent-submit">
                    👨‍👩‍👧‍👦 เข้าสู่ระบบสำหรับผู้ปกครอง
                </button>
            </form>
        </div>
    </div>

    <!-- ES Module Integration -->
    <script type="module">
        import { db } from './core/supabase-client.js';

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btn-google-login')?.addEventListener('click', loginWithGoogle);
            document.getElementById('parent-login-form')?.addEventListener('submit', handleParentLogin);
        });

        async function loginWithGoogle() {
            try {
                const { data, error } = await db.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        queryParams: { hd: 'buached.ac.th' },
                        redirectTo: window.location.href.replace(/login\.html.*$/, 'landing.html')
                    }
                });
                if (error) throw error;
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อ: ' + err.message);
            }
        }

        async function handleParentLogin(event) {
            event.preventDefault();
            
            const studentId = document.getElementById('parent-student-id').value.trim();
            const password = document.getElementById('parent-password').value.trim();

            try {
                const { data: student, error } = await db
                    .from('students')
                    .select('id, student_id, first_name, last_name, parent_password')
                    .eq('student_id', studentId)
                    .maybeSingle();

                if (error) {
                    console.error('Supabase Error:', error);
                    alert('เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล: ' + error.message);
                    return;
                }

                if (!student) {
                    alert('ไม่พบข้อมูลเลขประจำตัวนักเรียนนี้ในระบบ');
                    return;
                }

                if (student.parent_password === password) {
                    const fullName = (student.first_name && student.last_name) 
                        ? `${student.first_name} ${student.last_name}`
                        : (student.full_name || 'นักเรียน');

                    localStorage.setItem('parent_session', JSON.stringify({
                        role: 'parent',
                        student_id: student.student_id,
                        student_name: fullName
                    }));

                    alert(`ยินดีต้อนรับผู้ปกครองของ ${fullName}`);
                    window.location.href = 'apps/parent-app/parent.html';
                } else {
                    alert('รหัสผ่านไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง');
                }

            } catch (err) {
                console.error(err);
                alert('เกิดข้อผิดพลาดไม่ทราบสาเหตุ: ' + err.message);
            }
        }

        window.loginWithGoogle = loginWithGoogle;
        window.handleParentLogin = handleParentLogin;
    </script>
</body>
</html>
