<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เข้าสู่ระบบ - BCW SMART HUB</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Card Login Container -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-200/80 p-8 space-y-6">
        
        <!-- Header / Logo -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 text-white rounded-2xl shadow-lg shadow-blue-500/30 mb-2">
                <i class="fa-solid fa-graduation-cap text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800 tracking-tight">BCW SMART HUB</h1>
            <p class="text-xs text-slate-500 font-medium">ระบบสารสนเทศเพื่อการบริหารจัดการโรงเรียน</p>
        </div>

        <!-- Section 1: ปุ่มเข้าสู่ระบบแบบ SSO (Google & LINE) -->
        <div class="space-y-3 pt-2">
            
            <!-- ปุ่ม Google SSO (สำหรับครู / นักเรียน / งานเอกสารคอมพิวเตอร์) -->
            <button onclick="loginWithGoogle()" 
                    type="button"
                    class="w-full flex items-center justify-center gap-3 bg-white hover:bg-slate-50 text-slate-700 font-medium py-3 px-4 rounded-xl border border-slate-300 shadow-sm transition-all duration-200 active:scale-[0.99]">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span class="text-sm">เข้าสู่ระบบด้วย Google (@buached.ac.th)</span>
            </button>

            <!-- ปุ่ม LINE Login (สำหรับผู้ปกครอง / ใช้งานด่วนบนมือถือ) -->
            <button onclick="loginWithLine()" 
                    type="button"
                    class="w-full flex items-center justify-center gap-3 bg-[#06C755] hover:bg-[#05b34c] text-white font-medium py-3 px-4 rounded-xl shadow-sm transition-all duration-200 active:scale-[0.99]">
                <i class="fa-brands fa-line text-2xl"></i>
                <span class="text-sm">เข้าสู่ระบบด้วย LINE</span>
            </button>

        </div>

        <!-- Divider เส้นแบ่ง -->
        <div class="relative flex py-1 items-center">
            <div class="flex-grow border-t border-slate-200"></div>
            <span class="flex-shrink mx-4 text-xs text-slate-400 font-normal">หรือใช้อีเมล / รหัสผ่าน</span>
            <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <!-- Section 2: ฟอร์ม Fallback (สำหรับระบบเดิมหรือผู้ไม่มี SSO) -->
        <form id="login-form" onsubmit="handleEmailLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">อีเมล หรือ รหัสประจำตัว</label>
                <input type="text" id="username" required 
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm transition-all"
                       placeholder="เช่น name@buached.ac.th">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">รหัสผ่าน</label>
                <input type="password" id="password" required 
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm transition-all"
                       placeholder="••••••••">
            </div>
            <button type="submit" 
                    class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-2.5 rounded-xl text-sm transition-all duration-200 active:scale-[0.99]">
                เข้าสู่ระบบ
            </button>
        </form>

        <!-- Footer -->
        <div class="text-center pt-2">
            <p class="text-[11px] text-slate-400">
                หากพบปัญหาการใช้งาน ติดต่อฝ่าย ICT โรงเรียนบัวเชดวิทยา
            </p>
        </div>

    </div>

    <!-- Scripts เชื่อมต่อ Supabase Auth -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../core/supabase-client.js"></script>
    <script>
        // 1. เข้าสู่ระบบด้วย Google SSO ผ่าน Supabase Auth
        async function loginWithGoogle() {
            try {
                const { data, error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin + '/apps/landing-app/landing.html'
                    }
                });
                if (error) throw error;
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการล็อกอินด้วย Google: ' + err.message);
            }
        }

        // 2. เข้าสู่ระบบด้วย LINE Login / LIFF
        function loginWithLine() {
            // นำไปยัง URL ของ LIFF App หรือ LINE OAuth Channel
            window.location.href = "https://liff.line.me/YOUR-LIFF-ID";
        }

        // 3. เข้าสู่ระบบด้วย Email/Password (Supabase Auth Native)
        async function handleEmailLogin(e) {
            e.preventDefault();
            const email = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;

                // ล็อกอินผ่าน นำไปหน้า landing.html
                window.location.replace('../landing-app/landing.html');
            } catch (err) {
                alert('การเข้าสู่ระบบไม่สำเร็จ: Check email/password อีกครั้ง');
            }
        }
    </script>
</body>
</html>
