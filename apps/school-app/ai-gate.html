<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BCW AI Gate Scan - กล้องสแกนอัจฉริยะ</title>
    <link rel="shortcut icon" href="../../assets/images/logo_bcw.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        html, body {
            font-family: 'Kanit', sans-serif;
            background-color: #022c22;
            color: #ffffff;
            height: 100dvh;
            max-height: 100dvh;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        .mirror-video { transform: scaleX(-1); }
    </style>
    <script src="../../core/bcw-page-transition.js?v=1"></script>
</head>
<body class="flex flex-col justify-between p-2.5 sm:p-4 gap-2 select-none">

    <!-- HEADER -->
    <header class="max-w-3xl w-full mx-auto bg-emerald-950/95 border border-emerald-800 rounded-2xl px-3 py-2 flex items-center justify-between gap-2 shrink-0 shadow-md">
        <div class="flex items-center gap-2 min-w-0">
            <a href="teacher.html" title="กลับหน้าเช็กชื่อ" class="w-8 h-8 rounded-xl bg-emerald-800 hover:bg-emerald-700 text-amber-300 flex items-center justify-center shrink-0 active:scale-95 transition">
                <i class="fa-solid fa-arrow-left text-xs"></i>
            </a>
            <div class="min-w-0">
                <h1 class="text-xs sm:text-sm font-extrabold text-amber-400 leading-tight truncate">BCW AI GATE SCAN</h1>
                <span id="systemStatusBadge" class="text-[10px] text-amber-300 font-semibold block truncate">
                    พร้อมเปิดกล้องสแกน
                </span>
            </div>
        </div>

        <select id="classroomFilter" onchange="reloadFaceDatabase()" class="bg-emerald-900 border border-emerald-700 text-[11px] font-bold rounded-xl px-2.5 py-1.5 text-white outline-none shrink-0 max-w-[115px]">
            <option value="ALL">ทุกห้องเรียน</option>
        </select>
    </header>

    <!-- CAMERA VIEWPORT -->
    <main class="max-w-3xl w-full mx-auto flex-1 min-h-0 flex flex-col gap-2">
        <div class="relative flex-1 min-h-0 bg-slate-950 rounded-3xl border-2 border-emerald-500/80 overflow-hidden shadow-2xl flex items-center justify-center">
            <video id="gateVideo" autoplay muted playsinline webkit-playsinline class="w-full h-full object-cover mirror-video"></video>
            <canvas id="overlayCanvas" class="absolute inset-0 w-full h-full pointer-events-none mirror-video"></canvas>
            <canvas id="snapshotCanvas" class="hidden"></canvas>

            <!-- ป้ายแจ้งสถานะกล้อง -->
            <div id="cameraPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/85 text-center p-4 z-10">
                <i class="fa-solid fa-camera text-3xl text-emerald-400 mb-2"></i>
                <p id="cameraPlaceholderText" class="text-xs font-bold text-emerald-100">กดปุ่ม "เปิดกล้องสแกน" ด้านล่างเพื่ออนุญาตใช้งานกล้อง</p>
            </div>

            <!-- กรอบเล็งใบหน้า -->
            <div class="absolute inset-0 pointer-events-none flex items-center justify-center z-10">
                <div class="w-44 h-56 sm:w-60 sm:h-72 border-2 border-dashed border-amber-400/75 rounded-3xl"></div>
            </div>

            <!-- ตัวนับจำนวน -->
            <div class="absolute top-3 right-3 bg-emerald-950/85 backdrop-blur-xs border border-emerald-600/60 px-2.5 py-1 rounded-xl text-[11px] font-extrabold text-amber-300 z-10">
                สแกนแล้ว <span id="todayScanCounter">0</span> คน
            </div>

            <!-- ป๊อบอับแจ้งผล -->
            <div id="scanSuccessPopup" class="hidden absolute bottom-3 left-3 right-3 bg-emerald-900/95 backdrop-blur-md border-2 border-amber-400 rounded-2xl p-2.5 flex items-center gap-2.5 shadow-2xl z-20">
                <img id="popupAvatar" src="" class="w-12 h-12 rounded-xl object-cover border border-white shrink-0">
                <div class="min-w-0 flex-1">
                    <div class="text-[10px] text-amber-300 font-bold">✅ บันทึกเข้าเรียนสำเร็จ</div>
                    <div id="popupName" class="text-sm font-extrabold text-white truncate">-</div>
                    <div id="popupMeta" class="text-[11px] text-emerald-200 truncate">-</div>
                </div>
                <div id="popupTime" class="text-sm font-black text-amber-400 font-mono shrink-0">00:00</div>
            </div>
        </div>

        <!-- CONTROLS -->
        <div class="flex gap-2 shrink-0">
            <select id="cameraDeviceSelect" onchange="startCameraWithId(this.value)" class="hidden bg-emerald-900 border border-emerald-700 text-[11px] font-bold rounded-2xl px-2.5 text-white outline-none max-w-[130px]"></select>
            <button type="button" id="btnStartCamera" onclick="startCamera()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white text-xs sm:text-sm font-extrabold py-3 rounded-2xl shadow-lg flex items-center justify-center gap-2 cursor-pointer transition">
                <i class="fa-solid fa-camera"></i> <span id="btnStartText">เปิดกล้องสแกน</span>
            </button>
            <button type="button" onclick="switchCamera()" title="สลับกล้องหน้า/หลัง" class="bg-emerald-900 hover:bg-emerald-800 active:scale-95 text-amber-300 border border-emerald-700 px-4 py-3 rounded-2xl shadow-lg cursor-pointer transition">
                <i class="fa-solid fa-camera-rotate text-base"></i>
            </button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../core/supabase-client.js?v=400"></script>

    <script>
        const SUPABASE_URL = 'https://wfpopolzgxbglgmzjafg.supabase.co';
        const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights';
        const COOLDOWN_MS = 5 * 60 * 1000;

        let currentStream = null;
        let facingMode = 'user';
        let faceMatcher = null;
        let studentsMap = new Map();
        let lastScanTimestamps = new Map();
        let scanCountToday = 0;
        let detectionTimer = null;

        window.addEventListener('DOMContentLoaded', async () => {
            await startCamera();
            await loadModelsAndStudents();
        });

        function stopCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
        }

        async function populateCameraDevices() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const cams = devices.filter(d => d.kind === 'videoinput');
                const select = document.getElementById('cameraDeviceSelect');
                if (cams.length > 1 && select) {
                    select.innerHTML = cams.map((c, idx) => `<option value="${c.deviceId}">${c.label || `กล้อง ${idx + 1}`}</option>`).join('');
                    select.classList.remove('hidden');
                }
            } catch (e) {}
        }

        async function startCamera(specificDeviceId = null) {
            const video = document.getElementById('gateVideo');
            const placeholder = document.getElementById('cameraPlaceholder');
            const placeholderText = document.getElementById('cameraPlaceholderText');
            const btnText = document.getElementById('btnStartText');

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                if (placeholderText) placeholderText.innerText = '❌ เบราว์เซอร์นี้ไม่รองรับการเปิดกล้อง หรือไม่ได้เปิดผ่าน HTTPS';
                return;
            }

            stopCamera();
            if (btnText) btnText.innerText = 'กำลังเชื่อมต่อกล้อง...';

            // ลองเปิดกล้องด้วยเงื่อนไขที่ยืดหยุ่นที่สุด (ใช้ได้ทั้งมือถือและคอมพิวเตอร์)
            const constraintsList = specificDeviceId
                ? [{ video: { deviceId: { exact: specificDeviceId } }, audio: false }]
                : [
                    { video: { facingMode: facingMode }, audio: false },
                    { video: true, audio: false }
                  ];

            let connected = false;
            let lastError = null;

            for (const constraints of constraintsList) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    currentStream = stream;
                    video.srcObject = stream;
                    await video.play();
                    connected = true;
                    break;
                } catch (err) {
                    lastError = err;
                }
            }

            if (connected) {
                const isFront = (facingMode === 'user' && !specificDeviceId);
                video.classList.toggle('mirror-video', isFront);
                document.getElementById('overlayCanvas')?.classList.toggle('mirror-video', isFront);
                if (placeholder) placeholder.classList.add('hidden');
                if (btnText) btnText.innerText = 'กล้องทำงานปกติ';
                await populateCameraDevices();
            } else {
                if (placeholder) placeholder.classList.remove('hidden');
                if (placeholderText) {
                    placeholderText.innerText = `⛔ ไม่สามารถเปิดกล้องได้ (${lastError?.name || 'Permission Denied'})\nกรุณากดอนุญาตสิทธิ์กล้องที่แถบ URL ด้านบน แล้วกดปุ่มเปิดกล้องอีกครั้ง`;
                }
                if (btnText) btnText.innerText = 'ลองเปิดกล้องอีกครั้ง';
            }
        }

        function startCameraWithId(deviceId) {
            if (deviceId) startCamera(deviceId);
        }

        function switchCamera() {
            facingMode = (facingMode === 'user') ? 'environment' : 'user';
            startCamera();
        }

        function setStatus(htmlText, color = 'amber') {
            const badge = document.getElementById('systemStatusBadge');
            if (!badge) return;
            const colors = { amber: 'text-amber-300', emerald: 'text-emerald-300', rose: 'text-rose-400' };
            badge.className = `text-[10px] font-semibold block truncate ${colors[color] || 'text-amber-300'}`;
            badge.innerHTML = htmlText;
        }

        async function loadModelsAndStudents() {
            try {
                let waitCount = 0;
                while (typeof faceapi === 'undefined' && waitCount < 30) {
                    await new Promise(r => setTimeout(r, 200));
                    waitCount++;
                }
                if (typeof faceapi === 'undefined') throw new Error('โหลดไลบรารี AI ไม่สำเร็จ');

                setStatus('<i class="fa-solid fa-spinner fa-spin mr-1"></i> กำลังโหลดโมเดล AI...');
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);

                const client = window.supabaseClient || window.db || window.supabase;
                const { data: students } = await client.from('students').select('*');
                if (!students || students.length === 0) {
                    setStatus('⚠️ ไม่พบข้อมูลนักเรียนในระบบ', 'rose');
                    return;
                }

                const rooms = [...new Set(students.map(s => s.classroom).filter(Boolean))].sort();
                const roomSelect = document.getElementById('classroomFilter');
                rooms.forEach(r => {
                    const opt = document.createElement('option');
                    opt.value = r;
                    opt.textContent = `ห้อง ${r}`;
                    roomSelect.appendChild(opt);
                });

                students.forEach(s => {
                    const id = String(s.student_id || s.id).trim();
                    studentsMap.set(id, s);
                });

                await reloadFaceDatabase();
                startDetectionLoop();
            } catch (err) {
                setStatus('❌ โหลดโมเดล AI ไม่สำเร็จ', 'rose');
            }
        }

        async function reloadFaceDatabase() {
            const selectedRoom = document.getElementById('classroomFilter')?.value || 'ALL';
            setStatus('<i class="fa-solid fa-spinner fa-spin mr-1"></i> กำลังอ่านรูปนักเรียน...');

            const descriptors = [];
            for (const [id, s] of studentsMap.entries()) {
                if (selectedRoom !== 'ALL' && s.classroom !== selectedRoom) continue;
                const imgUrl = s.avatar_url || `${SUPABASE_URL}/storage/v1/object/public/avatars/${id}.webp`;
                try {
                    const img = await faceapi.fetchImage(imgUrl);
                    const det = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
                    if (det) descriptors.push(new faceapi.LabeledFaceDescriptors(id, [det.descriptor]));
                } catch (e) {}
            }

            faceMatcher = descriptors.length > 0 ? new faceapi.FaceMatcher(descriptors, 0.55) : null;
            setStatus(`🟢 พร้อมสแกน (${descriptors.length} คน)`, 'emerald');
        }

        function startDetectionLoop() {
            if (detectionTimer) clearInterval(detectionTimer);
            const video = document.getElementById('gateVideo');
            const canvas = document.getElementById('overlayCanvas');

            detectionTimer = setInterval(async () => {
                if (!faceMatcher || !video.srcObject || video.paused || video.ended || video.clientWidth === 0) return;

                const displaySize = { width: video.clientWidth, height: video.clientHeight };
                faceapi.matchDimensions(canvas, displaySize);

                const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceDescriptors();

                const resized = faceapi.resizeResults(detections, displaySize);
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (const d of resized) {
                    const match = faceMatcher.findBestMatch(d.descriptor);
                    const box = d.detection.box;

                    if (match.label !== 'unknown') {
                        const student = studentsMap.get(match.label);
                        const fullName = student ? `${student.prefix || ''}${student.first_name || ''} ${student.last_name || ''}`.trim() : match.label;
                        ctx.strokeStyle = '#34d399';
                        ctx.lineWidth = 3;
                        ctx.strokeRect(box.x, box.y, box.width, box.height);
                        await recordStudentGateScan(match.label, student, fullName);
                    } else {
                        ctx.strokeStyle = '#fbbf24';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(box.x, box.y, box.width, box.height);
                    }
                }
            }, 900);
        }

        async function recordStudentGateScan(studentId, student, fullName) {
            const now = Date.now();
            const lastTime = lastScanTimestamps.get(studentId) || 0;
            if (now - lastTime < COOLDOWN_MS) return;

            lastScanTimestamps.set(studentId, now);
            const nowDate = new Date();
            const isLate = (nowDate.getHours() > 8) || (nowDate.getHours() === 8 && nowDate.getMinutes() > 0);
            const status = isLate ? 'late' : 'present';
            const timeStr = nowDate.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

            const video = document.getElementById('gateVideo');
            const snapCanvas = document.getElementById('snapshotCanvas');
            snapCanvas.width = 240;
            snapCanvas.height = 180;
            snapCanvas.getContext('2d').drawImage(video, 0, 0, 240, 180);
            const snapshotDataUrl = snapCanvas.toDataURL('image/jpeg', 0.7);

            const client = window.supabaseClient || window.db || window.supabase;
            if (client) {
                await client.from('attendance_logs').insert([{
                    student_id: studentId,
                    status: status,
                    method: 'ai_gate',
                    period_no: 0,
                    recorded_at: nowDate.toISOString(),
                    subject_name: `สแกนเข้าโรงเรียน (${isLate ? 'มาสาย' : 'ปกติ'})`
                }]);
            }

            scanCountToday++;
            document.getElementById('todayScanCounter').innerText = scanCountToday;

            const popup = document.getElementById('scanSuccessPopup');
            document.getElementById('popupAvatar').src = snapshotDataUrl;
            document.getElementById('popupName').innerText = fullName;
            document.getElementById('popupMeta').innerText = `ห้อง ${student?.classroom || '-'} • ${isLate ? '🟡 มาสาย' : '🟢 เข้าเรียนปกติ'}`;
            document.getElementById('popupTime').innerText = `${timeStr}`;
            popup.classList.remove('hidden');
            setTimeout(() => popup.classList.add('hidden'), 4000);
        }
    </script>
</body>
</html>
