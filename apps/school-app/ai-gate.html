<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BCW AI Gate Scan - กล้อง AI สแกนเข้าเรียน</title>
    <link rel="shortcut icon" href="../../assets/images/logo_bcw.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../../core/bcw-page-transition.js?v=5"></script>
    <style>
        html, body {
            font-family: 'Kanit', sans-serif;
            background-color: #020617;
            color: #ffffff;
            width: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        @keyframes aiScanBeam {
            0% { top: 8%; opacity: 0.25; }
            50% { top: 88%; opacity: 1; }
            100% { top: 8%; opacity: 0.25; }
        }
        .ai-scan-beam {
            position: absolute;
            left: 6%;
            right: 6%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #10b981, #fbbf24, #10b981, transparent);
            box-shadow: 0 0 14px #34d399;
            animation: aiScanBeam 2.2s infinite ease-in-out;
        }
        .ai-corner {
            position: absolute;
            width: 26px;
            height: 26px;
            border-color: #fbbf24;
            border-style: solid;
        }
    </style>
</head>
<body class="relative w-full h-[100dvh] overflow-hidden select-none">

    <!-- FULLSCREEN CAMERA VIDEO LAYER (เต็มจอพอดีไม่ล้น) -->
    <video id="gateVideo" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover z-0 hidden"></video>

    <!-- พื้นหลังเมื่อยังไม่เปิดกล้อง -->
    <div id="cameraIdleBg" class="absolute inset-0 bg-gradient-to-b from-emerald-950 via-slate-950 to-emerald-950 z-0"></div>

    <!-- SAFE-AREA OVERLAY CONTAINER -->
    <div class="relative z-10 w-full h-full flex flex-col justify-between p-3 sm:p-4 max-w-xl mx-auto"
         style="padding-top: max(12px, env(safe-area-inset-top)); padding-bottom: max(12px, env(safe-area-inset-bottom));">

        <!-- 1. TOP FLOATING HEADER -->
        <header class="bg-emerald-950/85 backdrop-blur-md border border-emerald-500/40 rounded-2xl p-2.5 flex items-center justify-between gap-2 shadow-xl shrink-0">
            <div class="flex items-center gap-2.5 min-w-0">
                <a href="teacher.html" class="w-9 h-9 rounded-xl bg-emerald-800/90 hover:bg-emerald-700 border border-emerald-500/50 text-amber-300 flex items-center justify-center shrink-0 active:scale-95 transition">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                </a>
                <div class="min-w-0">
                    <div class="flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse shrink-0"></span>
                        <h1 class="text-base sm:text-lg font-extrabold text-amber-400 tracking-wide leading-tight truncate">BCW AI GATE SCAN</h1>
                    </div>
                    <p id="cameraStatusSub" class="text-[11px] text-emerald-100/90 font-normal truncate">โหมดกล้อง AI ตรวจจับอัตโนมัติ</p>
                </div>
            </div>

            <div class="flex items-center gap-1.5 shrink-0">
                <span class="bg-amber-400/15 border border-amber-400/50 text-amber-300 text-xs font-semibold px-2.5 py-1.5 rounded-xl">
                    <span id="scannedCountText">0</span> คน
                </span>
                <select id="classroomFilter" onchange="onClassroomFilterChange()" class="bg-emerald-950/90 border border-emerald-500/60 text-white text-xs font-medium rounded-xl px-2.5 py-1.5 outline-none max-w-[105px]">
                    <option value="ALL">ทุกห้อง</option>
                </select>
            </div>
        </header>

        <!-- 2. CENTER AI RETICLE FRAME -->
        <main class="flex-1 flex flex-col items-center justify-center min-h-0 my-2 relative">
            <div class="relative w-64 h-64 sm:w-72 sm:h-72 flex flex-col items-center justify-center text-center p-4">
                <!-- มุมกรอบเล็ง AI 4 มุม -->
                <span class="ai-corner top-0 left-0 border-t-4 border-l-4 rounded-tl-2xl"></span>
                <span class="ai-corner top-0 right-0 border-t-4 border-r-4 rounded-tr-2xl"></span>
                <span class="ai-corner bottom-0 left-0 border-b-4 border-l-4 rounded-bl-2xl"></span>
                <span class="ai-corner bottom-0 right-0 border-b-4 border-r-4 rounded-br-2xl"></span>

                <div id="laserBar" class="ai-scan-beam hidden"></div>

                <!-- ข้อความแนะนำเมื่อกล้องยังไม่เปิด -->
                <div id="cameraPlaceholderContent" class="flex flex-col items-center gap-2.5 bg-slate-950/75 backdrop-blur-sm p-4 rounded-2xl border border-emerald-500/30">
                    <div class="w-12 h-12 rounded-2xl bg-emerald-500 text-emerald-950 flex items-center justify-center text-xl shadow-lg">
                        <i class="fa-solid fa-expand"></i>
                    </div>
                    <p id="cameraGuideText" class="text-xs sm:text-sm font-normal text-white leading-relaxed">
                        กำลังเตรียมกล้อง AI หรือกดปุ่มด้านล่างเพื่ออนุญาตกล้อง
                    </p>
                </div>
            </div>

            <!-- การ์ดแจ้งผลลอยตัวเมื่อสแกนติด -->
            <div id="scanResultToast" class="hidden absolute bottom-1 left-0 right-0 z-30 bg-emerald-950/95 backdrop-blur-md border-2 border-amber-400 rounded-2xl p-2.5 shadow-2xl flex items-center justify-between gap-2">
                <div class="min-w-0">
                    <div class="text-[11px] text-amber-300 font-medium">✅ AI บันทึกเข้าเรียนสำเร็จ</div>
                    <div id="toastStudentName" class="text-sm font-bold text-white truncate">-</div>
                </div>
                <span id="toastStudentTime" class="text-xs bg-emerald-900 text-emerald-200 px-2.5 py-1 rounded-lg font-mono shrink-0">00:00</span>
            </div>
        </main>

        <!-- 3. BOTTOM FLOATING CONTROLS (ไม่ล้นหน้าจอ) -->
        <footer class="space-y-2 shrink-0">
            <!-- ช่องยิงบาร์โค้ด / พิมพ์รหัสสำรอง -->
            <div class="bg-slate-950/80 backdrop-blur-md border border-emerald-500/40 rounded-2xl p-2 flex gap-1.5 shadow-lg">
                <input type="text" id="manualScanInput" placeholder="สแกน หรือพิมพ์รหัสนักเรียน..." onkeydown="if(event.key==='Enter') handleManualScan()" class="flex-1 min-w-0 bg-emerald-950/80 border border-emerald-700/80 rounded-xl px-3 py-2 text-xs sm:text-sm text-white placeholder-emerald-300/60 outline-none focus:border-amber-400">
                <button type="button" onclick="handleManualScan()" class="bg-amber-400 hover:bg-amber-300 text-emerald-950 font-semibold text-xs sm:text-sm px-3.5 py-2 rounded-xl shrink-0 active:scale-95 transition cursor-pointer">
                    เช็กชื่อ
                </button>
            </div>

            <!-- ปุ่มเปิด/ปิดกล้อง + สลับกล้องหน้า/หลัง -->
            <div class="flex items-center gap-2">
                <button type="button" id="btnToggleCamera" onclick="toggleGateCamera()" class="flex-1 bg-emerald-500 hover:bg-emerald-400 text-emerald-950 font-bold text-sm sm:text-base py-3 rounded-2xl shadow-xl flex items-center justify-center gap-2 active:scale-95 transition cursor-pointer">
                    <i class="fa-solid fa-camera text-base"></i>
                    <span id="btnCameraLabel">เปิดกล้อง AI</span>
                </button>

                <button type="button" onclick="switchGateCamera()" title="สลับกล้องหน้า/หลัง" class="w-12 h-12 bg-emerald-950/90 hover:bg-emerald-900 border border-emerald-500/50 text-amber-300 rounded-2xl flex items-center justify-center text-base shadow-xl active:scale-95 transition cursor-pointer shrink-0">
                    <i class="fa-solid fa-camera-rotate"></i>
                </button>
            </div>
        </footer>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../core/supabase-client.js?v=400"></script>
<script src="../../core/auth-service.js?v=400"></script>
<script src="../../core/auth-manager.js?v=400"></script>
<script>
    let GATE_STREAM = null;
    let FACING_MODE = 'environment';
    let ALL_STUDENTS = [];
    let SCANNED_SET = new Set();
    let SCAN_LOOP_ID = null;
    let LAST_SCANNED_CODE = '';
    let LAST_SCANNED_TIME = 0;

    document.addEventListener('DOMContentLoaded', async () => {
        try {
            await loadStudentsAndClassrooms();
            await startGateCamera(true);
        } finally {
            if (window.hideBCWCurtain) window.hideBCWCurtain();
        }
    });

    async function loadStudentsAndClassrooms() {
        const client = window.supabaseClient || window.db || window.supabase;
        if (!client) return;
        try {
            const { data } = await client.from('students').select('*').order('classroom', { ascending: true });
            ALL_STUDENTS = data || [];
            const rooms = [...new Set(ALL_STUDENTS.map(s => s.classroom).filter(Boolean))];
            const select = document.getElementById('classroomFilter');
            if (select) {
                rooms.forEach(r => {
                    const opt = document.createElement('option');
                    opt.value = r;
                    opt.textContent = `ห้อง ${r}`;
                    select.appendChild(opt);
                });
            }
        } catch (e) {}
    }

    function onClassroomFilterChange() {
        const room = document.getElementById('classroomFilter')?.value;
        const sub = document.getElementById('cameraStatusSub');
        if (sub) sub.innerText = room === 'ALL' ? 'AI พร้อมสแกนทุกห้องเรียน' : `AI กรองเฉพาะห้อง ${room}`;
    }

    async function startGateCamera(isSilentAuto = false) {
        const video = document.getElementById('gateVideo');
        const idleBg = document.getElementById('cameraIdleBg');
        const placeholder = document.getElementById('cameraPlaceholderContent');
        const guideText = document.getElementById('cameraGuideText');
        const laser = document.getElementById('laserBar');
        const btnLabel = document.getElementById('btnCameraLabel');
        const btnToggle = document.getElementById('btnToggleCamera');
        const statusSub = document.getElementById('cameraStatusSub');

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            if (guideText) guideText.innerText = 'เบราว์เซอร์ไม่รองรับการเปิดกล้อง กรุณาเปิดผ่าน Chrome หรือ Safari';
            return;
        }

        stopGateCamera();

        try {
            if (guideText) guideText.innerText = 'กำลังเปิดกล้อง AI...';

            try {
                GATE_STREAM = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: FACING_MODE },
                    audio: false
                });
            } catch (firstErr) {
                GATE_STREAM = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: false
                });
            }

            video.srcObject = GATE_STREAM;
            video.setAttribute('playsinline', 'true');
            video.muted = true;
            await video.play();

            video.classList.remove('hidden');
            if (idleBg) idleBg.classList.add('hidden');
            if (placeholder) placeholder.classList.add('hidden');
            if (laser) laser.classList.remove('hidden');
            if (btnLabel) btnLabel.innerText = 'ปิดกล้อง AI';
            if (btnToggle) {
                btnToggle.classList.remove('bg-emerald-500', 'text-emerald-950');
                btnToggle.classList.add('bg-rose-600', 'text-white');
            }
            if (statusSub) statusSub.innerText = 'AI กำลังตรวจจับ • เล็งใบหน้าหรือ QR บัตร';

            startBarcodeLoop(video);
        } catch (err) {
            const msg = (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError')
                ? 'ถูกบล็อกสิทธิ์กล้อง กรุณากดรูปแม่กุญแจบนแถบ URL แล้วเลือก "อนุญาตกล้อง"'
                : 'กดปุ่ม "เปิดกล้อง AI" ด้านล่างเพื่อเริ่มสแกน';
            if (guideText) guideText.innerText = msg;
            if (!isSilentAuto && (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError')) {
                alert(msg);
            }
        }
    }

    function stopGateCamera() {
        clearInterval(SCAN_LOOP_ID);
        if (GATE_STREAM) {
            GATE_STREAM.getTracks().forEach(track => track.stop());
            GATE_STREAM = null;
        }
        const video = document.getElementById('gateVideo');
        const idleBg = document.getElementById('cameraIdleBg');
        const placeholder = document.getElementById('cameraPlaceholderContent');
        const laser = document.getElementById('laserBar');
        const btnLabel = document.getElementById('btnCameraLabel');
        const btnToggle = document.getElementById('btnToggleCamera');
        const statusSub = document.getElementById('cameraStatusSub');

        if (video) {
            video.srcObject = null;
            video.classList.add('hidden');
        }
        if (idleBg) idleBg.classList.remove('hidden');
        if (placeholder) placeholder.classList.remove('hidden');
        if (laser) laser.classList.add('hidden');
        if (btnLabel) btnLabel.innerText = 'เปิดกล้อง AI';
        if (btnToggle) {
            btnToggle.classList.remove('bg-rose-600', 'text-white');
            btnToggle.classList.add('bg-emerald-500', 'text-emerald-950');
        }
        if (statusSub) statusSub.innerText = 'โหมดกล้อง AI พร้อมใช้งาน';
    }

    async function toggleGateCamera() {
        if (GATE_STREAM) {
            stopGateCamera();
        } else {
            await startGateCamera(false);
        }
    }

    async function switchGateCamera() {
        FACING_MODE = (FACING_MODE === 'environment') ? 'user' : 'environment';
        await startGateCamera(false);
    }

    function startBarcodeLoop(video) {
        if (!('BarcodeDetector' in window)) return;
        const detector = new BarcodeDetector({ formats: ['qr_code', 'code_128', 'code_39', 'ean_13'] });
        clearInterval(SCAN_LOOP_ID);
        SCAN_LOOP_ID = setInterval(async () => {
            if (!GATE_STREAM || video.readyState < 2) return;
            try {
                const codes = await detector.detect(video);
                if (codes && codes.length > 0) {
                    const raw = String(codes[0].rawValue || '').trim();
                    const now = Date.now();
                    if (raw && (raw !== LAST_SCANNED_CODE || now - LAST_SCANNED_TIME > 3500)) {
                        LAST_SCANNED_CODE = raw;
                        LAST_SCANNED_TIME = now;
                        await recordStudentScan(raw);
                    }
                }
            } catch (e) {}
        }, 500);
    }

    async function handleManualScan() {
        const input = document.getElementById('manualScanInput');
        const val = input?.value.trim();
        if (!val) return;
        input.value = '';
        await recordStudentScan(val);
    }

    async function recordStudentScan(rawCode) {
        const roomFilter = document.getElementById('classroomFilter')?.value || 'ALL';
        const student = ALL_STUDENTS.find(s => {
            const matchId = String(s.student_id || s.id).trim() === rawCode;
            const matchRoom = roomFilter === 'ALL' || String(s.classroom).trim() === roomFilter;
            return matchId && matchRoom;
        });

        if (!student) {
            alert(`ไม่พบรหัสนักเรียน "${rawCode}" ${roomFilter !== 'ALL' ? `ในห้อง ${roomFilter}` : 'ในระบบ'}`);
            return;
        }

        const sid = String(student.student_id || student.id).trim();
        const fullName = `${student.prefix || ''}${student.first_name || ''} ${student.last_name || ''}`.trim();
        const client = window.supabaseClient || window.db || window.supabase;

        if (client) {
            await client.from('attendance_logs').insert([{
                student_id: sid,
                status: 'PRESENT',
                method: 'ai_gate',
                period_no: 0,
                recorded_at: new Date().toISOString(),
                subject_name: `สแกนกล้อง AI (${student.classroom || '-'})`
            }]);
        }

        SCANNED_SET.add(sid);
        document.getElementById('scannedCountText').innerText = SCANNED_SET.size;

        const toast = document.getElementById('scanResultToast');
        document.getElementById('toastStudentName').innerText = `${fullName} (${student.classroom || '-'})`;
        document.getElementById('toastStudentTime').innerText = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 3000);
    }
</script>
</body>
</html>
