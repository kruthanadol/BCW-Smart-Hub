<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BCW AI GATE SCAN - โรงเรียนบัวเชดวิทยา</title>
    <link rel="icon" type="image/png" href="../../assets/images/logo_bcw.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <!-- Supabase SDK & Global Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../core/supabase-client.js?v=600"></script>

    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #02120e;
            color: #f8fafc;
            overflow: hidden;
            height: 100dvh;
        }
        #videoWrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .mirror-mode {
            transform: scaleX(-1);
        }
        #gateVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #gateCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body class="flex flex-col justify-between p-3 sm:p-4 select-none">

    <!-- 1. TOP HEADER BAR -->
    <header class="max-w-xl mx-auto w-full bg-[#06241c]/90 border border-emerald-800/60 rounded-2xl p-2.5 flex items-center justify-between gap-2 shadow-lg z-20">
        <div class="flex items-center gap-2.5 min-w-0">
            <a href="../../landing.html" class="w-9 h-9 rounded-xl bg-emerald-900/70 hover:bg-emerald-800 border border-emerald-700/60 flex items-center justify-center text-emerald-300 shrink-0">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="min-w-0">
                <div class="flex items-center gap-1.5">
                    <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse shrink-0"></span>
                    <h1 class="text-sm sm:text-base font-extrabold text-amber-400 tracking-wide truncate">BCW AI GATE SCAN</h1>
                </div>
                <p id="statusSubText" class="text-[11px] text-slate-300 truncate">กำลังเชื่อมต่อฐานข้อมูลนักเรียน...</p>
            </div>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
            <!-- แสดงจำนวนใบหน้าที่โหลดจากฐานข้อมูลจริง -->
            <div id="faceCountBadge" class="bg-amber-500/20 border border-amber-500/40 text-amber-300 text-xs font-extrabold px-2.5 py-1.5 rounded-xl">
                0 คน
            </div>
            <!-- ปุ่มเลือกห้องเรียนจากฐานข้อมูลจริง -->
            <button type="button" onclick="window.openRoomModal()" id="btnSelectedRoom" class="bg-emerald-900/80 hover:bg-emerald-800 border border-emerald-600/50 text-emerald-200 text-xs font-bold px-3 py-1.5 rounded-xl flex items-center gap-1 cursor-pointer">
                <span id="selectedRoomText">ทุกห้อง</span>
                <i class="fa-solid fa-chevron-down text-[10px]"></i>
            </button>
        </div>
    </header>

    <!-- 2. CAMERA VIEWPORT -->
    <main class="max-w-xl mx-auto w-full flex-1 my-3 relative rounded-3xl overflow-hidden bg-[#041a14] border border-emerald-900/70 flex items-center justify-center">
        <div id="videoWrapper" class="hidden">
            <video id="gateVideo" autoplay muted playsinline></video>
            <canvas id="gateCanvas"></canvas>
        </div>

        <!-- กรอบเล็งสแกน 4 มุม -->
        <div class="absolute inset-8 sm:inset-12 pointer-events-none z-10">
            <div class="absolute top-0 left-0 w-9 h-9 border-t-4 border-l-4 border-amber-400 rounded-tl-2xl"></div>
            <div class="absolute top-0 right-0 w-9 h-9 border-t-4 border-r-4 border-amber-400 rounded-tr-2xl"></div>
            <div class="absolute bottom-0 left-0 w-9 h-9 border-b-4 border-l-4 border-amber-400 rounded-bl-2xl"></div>
            <div class="absolute bottom-0 right-0 w-9 h-9 border-b-4 border-r-4 border-amber-400 rounded-br-2xl"></div>
        </div>

        <!-- กล่องแจ้งเตือนตรงกลางเมื่อยังไม่เปิดกล้องหรือพบข้อผิดพลาด -->
        <div id="cameraPlaceholderBox" class="relative z-10 bg-[#0b1926]/95 border border-slate-700/80 rounded-2xl p-6 mx-6 text-center max-w-xs shadow-2xl">
            <div class="w-12 h-12 rounded-2xl bg-emerald-500 text-slate-950 flex items-center justify-center mx-auto mb-3 text-xl shadow-lg">
                <i class="fa-solid fa-camera"></i>
            </div>
            <p id="cameraErrorText" class="text-xs sm:text-sm font-bold text-slate-200 leading-relaxed">
                กดปุ่ม "เปิดกล้อง AI" ด้านล่างเพื่อเริ่มสแกนใบหน้าหรือ QR Code
            </p>
        </div>

        <!-- แถบแจ้งผลเมื่อสแกนติด -->
        <div id="scanResultToast" class="hidden absolute bottom-4 inset-x-4 z-20 bg-emerald-950/95 border-2 border-emerald-400 rounded-2xl p-3 text-center shadow-2xl">
            <div id="toastName" class="text-base font-extrabold text-emerald-300">-</div>
            <div id="toastDetail" class="text-xs text-slate-200 mt-0.5">-</div>
        </div>
    </main>

    <!-- 3. BOTTOM CONTROLS -->
    <footer class="max-w-xl mx-auto w-full space-y-2.5 z-20">
        <!-- ช่องพิมพ์รหัสนักเรียน / ยิงบาร์โค้ด -->
        <form onsubmit="window.handleManualSubmit(event)" class="bg-[#06241c] border border-emerald-800/70 rounded-2xl p-1.5 flex items-center gap-2">
            <input type="text" id="manualCodeInput" placeholder="สแกน หรือพิมพ์รหัสนักเรียน..." class="w-full bg-transparent px-3 py-2 text-sm text-white placeholder-slate-400 outline-none font-bold" autocomplete="off">
            <button type="submit" class="bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold px-5 py-2.5 rounded-xl text-xs shrink-0 cursor-pointer transition">
                เช็คชื่อ
            </button>
        </form>

        <!-- ปุ่มเปิดกล้อง AI + ปุ่มสลับกล้อง -->
        <div class="flex items-center gap-2">
            <button type="button" id="btnStartCamera" onclick="window.toggleAiCamera()" class="flex-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold py-3.5 px-4 rounded-2xl text-sm flex items-center justify-center gap-2 shadow-lg cursor-pointer transition">
                <i class="fa-solid fa-camera"></i>
                <span id="btnStartCameraText">เปิดกล้อง AI</span>
            </button>

            <button type="button" onclick="window.switchNextCamera()" title="สลับกล้อง (USB / หน้า / หลัง)" class="w-13 h-13 bg-[#06241c] hover:bg-emerald-900 border border-emerald-700/60 text-amber-400 rounded-2xl flex items-center justify-center text-lg cursor-pointer transition">
                <i class="fa-solid fa-camera-rotate"></i>
            </button>
        </div>
    </footer>

    <!-- MODAL เลือกห้องเรียนจากฐานข้อมูลจริง -->
    <div id="roomSelectModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-xs flex items-end sm:items-center justify-center p-3">
        <div class="bg-white text-slate-900 w-full max-w-md rounded-3xl overflow-hidden shadow-2xl">
            <div class="bg-[#06241c] text-white px-4 py-3.5 flex items-center justify-between">
                <div class="font-extrabold text-sm flex items-center gap-2">
                    <i class="fa-solid fa-door-open text-amber-400"></i>
                    <span>เลือกห้องเรียนที่ต้องการสแกน (ข้อมูลจริง)</span>
                </div>
                <button type="button" onclick="window.closeRoomModal()" class="w-7 h-7 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-xs cursor-pointer">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-4 space-y-3 max-h-[70vh] overflow-y-auto">
                <button type="button" onclick="window.selectClassroom('ALL')" class="w-full py-2.5 px-4 rounded-xl border-2 border-emerald-600 text-emerald-800 font-extrabold text-sm hover:bg-emerald-50 cursor-pointer">
                    🌐 สแกนทุกห้องเรียน (<span id="totalRealStudents">0</span> คน)
                </button>
                <div id="realRoomsGrid" class="grid grid-cols-3 gap-2">
                    <div class="col-span-3 text-center py-6 text-xs text-slate-400">กำลังโหลดรายชื่อห้องจากฐานข้อมูล...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const db = window.supabaseClient || window.db || window.supabase;
        const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';

        let allStudents = [];
        let selectedRoom = 'ALL';
        let faceMatcher = null;
        let isModelsReady = false;

        let currentStream = null;
        let cameraList = [];
        let currentCamIndex = 0;
        let isStartingCam = false;
        let isMirrored = false;
        let detectTimer = null;
        const recentCheckMap = new Map();

        // 1. โหลดโมเดล AI
        async function initAiModels() {
            try {
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);
                isModelsReady = true;
            } catch (e) {
                console.error('AI Model Error:', e);
            }
        }

        // 2. ดึงฐานข้อมูลนักเรียนจริงจาก Supabase (แบ่งดึงทีละ 1,000 แถวให้ครบทุกคน)
        async function loadRealStudentsFromSupabase() {
            const subText = document.getElementById('statusSubText');
            const dot = document.getElementById('statusDot');
            if (!db) {
                subText.innerText = 'ไม่พบการเชื่อมต่อ Supabase';
                return;
            }

            try {
                const [r1, r2, r3] = await Promise.all([
                    db.from('students').select('*').range(0, 999),
                    db.from('students').select('*').range(1000, 1999),
                    db.from('students').select('*').range(2000, 2999)
                ]);

                const raw = [...(r1.data || []), ...(r2.data || []), ...(r3.data || [])];
                allStudents = raw.filter(s => !s.status || s.status === 'active' || s.status === 'กำลังศึกษา');

                document.getElementById('totalRealStudents').innerText = allStudents.length;

                // สร้างปุ่มห้องเรียนจริงจากคอลัมน์ classroom / class_room / room
                const rooms = [...new Set(
                    allStudents
                        .map(s => String(s.classroom || s.class_room || s.room || '').trim())
                        .filter(Boolean)
                )].sort((a, b) => a.localeCompare(b, 'th', { numeric: true }));

                const grid = document.getElementById('realRoomsGrid');
                if (rooms.length > 0) {
                    grid.innerHTML = rooms.map(rm => `
                        <button type="button" onclick="window.selectClassroom('${rm}')" class="py-2 px-2 rounded-xl border border-slate-200 hover:border-emerald-500 hover:bg-emerald-50 text-xs font-extrabold text-slate-700 cursor-pointer transition">
                            ${rm}
                        </button>
                    `).join('');
                } else {
                    grid.innerHTML = `<div class="col-span-3 text-center py-4 text-xs text-rose-500">ไม่พบข้อมูลห้องเรียนในตาราง students</div>`;
                }

                await buildFaceMatcherForRoom('ALL');
                dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400 shrink-0';
                subText.innerText = `พร้อมใช้งาน • นักเรียนในระบบ ${allStudents.length} คน`;
            } catch (err) {
                console.error('Load students error:', err);
                subText.innerText = 'โหลดฐานข้อมูลไม่สำเร็จ: ' + err.message;
            }
        }

        // 3. สร้างตัวเทียบใบหน้าจากข้อมูลจริง (รองรับทั้ง face_descriptor และลิงก์รูปภาพทุกชื่อคอลัมน์)
        async function buildFaceMatcherForRoom(roomName) {
            if (!isModelsReady) await initAiModels();
            const targetList = roomName === 'ALL'
                ? allStudents
                : allStudents.filter(s => String(s.classroom || s.class_room || s.room || '').trim() === roomName);

            const descriptors = [];
            const subText = document.getElementById('statusSubText');

            for (const stu of targetList) {
                const sid = String(stu.student_id || stu.student_code || stu.id || '').trim();
                if (!sid) continue;

                // กรณีที่ 1: มีค่า face_descriptor (128 ค่า) เก็บไว้ในฐานข้อมูลแล้ว
                let desc = stu.face_descriptor;
                if (typeof desc === 'string') {
                    try { desc = JSON.parse(desc); } catch (e) { desc = null; }
                }
                if (Array.isArray(desc) && desc.length === 128) {
                    descriptors.push(new faceapi.LabeledFaceDescriptors(sid, [new Float32Array(desc)]));
                    continue;
                }

                // กรณีที่ 2: ดึงจากรูปโปรไฟล์ในฐานข้อมูล (เช็กทุกชื่อคอลัมน์ที่เป็นไปได้)
                const photoUrl = stu.avatar_url || stu.photo_url || stu.image_url || stu.profile_image || stu.picture_url;
                if (roomName !== 'ALL' && photoUrl && String(photoUrl).startsWith('http')) {
                    subText.innerText = `กำลังอ่านใบหน้านักเรียนห้อง ${roomName}... (${descriptors.length}/${targetList.length})`;
                    try {
                        const img = await faceapi.fetchImage(photoUrl);
                        const det = await faceapi
                            .detectSingleFace(img, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.4 }))
                            .withFaceLandmarks(true)
                            .withFaceDescriptor();
                        if (det) {
                            descriptors.push(new faceapi.LabeledFaceDescriptors(sid, [det.descriptor]));
                            // บันทึกเก็บลงฐานข้อมูลอัตโนมัติ ครั้งต่อไปจะได้ไม่ต้องโหลดรูปซ้ำ
                            db.from('students').update({ face_descriptor: Array.from(det.descriptor) }).eq('student_id', sid).then(() => {});
                        }
                    } catch (e) {}
                }
            }

            // อัปเดตตัวเลขจำนวนคนบนมุมขวาบน
            const badge = document.getElementById('faceCountBadge');
            badge.innerText = descriptors.length > 0 ? `${descriptors.length} ใบหน้า` : `${targetList.length} คน`;

            faceMatcher = descriptors.length > 0 ? new faceapi.FaceMatcher(descriptors, 0.58) : null;
            subText.innerText = descriptors.length > 0
                ? `พร้อมสแกนใบหน้า (${descriptors.length} คน) และ QR Code`
                : `พร้อมสแกน QR / พิมพ์รหัส (${targetList.length} คน ในระบบ)`;
        }

        // 4. เปิดกล้องแบบปลอดภัย (รองรับทั้ง USB Hikvision, กล้องโน้ตบุ๊ก และมือถือ ไม่พังด้วย NotFoundError / AbortError)
        window.toggleAiCamera = async function() {
            if (currentStream) {
                stopCamera();
                return;
            }
            await startCameraSafe();
        };

        function stopCamera() {
            if (detectTimer) {
                clearInterval(detectTimer);
                detectTimer = null;
            }
            if (currentStream) {
                currentStream.getTracks().forEach(t => t.stop());
                currentStream = null;
            }
            const video = document.getElementById('gateVideo');
            video.pause();
            video.srcObject = null;
            document.getElementById('videoWrapper').classList.add('hidden');
            document.getElementById('cameraPlaceholderBox').classList.remove('hidden');
            document.getElementById('btnStartCameraText').innerText = 'เปิดกล้อง AI';
            document.getElementById('btnStartCamera').className = 'flex-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold py-3.5 px-4 rounded-2xl text-sm flex items-center justify-center gap-2 shadow-lg cursor-pointer transition';
        }

        async function startCameraSafe(specificDeviceId = null) {
            if (isStartingCam) return;
            isStartingCam = true;

            const video = document.getElementById('gateVideo');
            const errText = document.getElementById('cameraErrorText');
            const btnText = document.getElementById('btnStartCameraText');

            try {
                btnText.innerText = 'กำลังเชื่อมต่อกล้อง...';

                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('เบราว์เซอร์ไม่รองรับการเปิดกล้อง (ต้องเปิดผ่าน HTTPS)');
                }

                // ค้นหารายชื่อกล้องทั้งหมดที่มีอยู่จริงในอุปกรณ์นี้ก่อน (ป้องกัน NotFoundError: Requested device not found)
                const devices = await navigator.mediaDevices.enumerateDevices();
                cameraList = devices.filter(d => d.kind === 'videoinput');

                if (cameraList.length === 0) {
                    throw new Error('ไม่พบอุปกรณ์กล้องในเครื่องนี้ (กรุณาเสียบสายกล้อง USB หรือเปิดผ่านมือถือ)');
                }

                // เลือกกล้อง USB ภายนอก (Hikvision / Logitech ฯลฯ) ก่อนเป็นอันดับแรกถ้ามี
                if (!specificDeviceId && cameraList.length > 0) {
                    const usbIdx = cameraList.findIndex(c => /hikvision|ds-u|logitech|usb|web\s?cam|uvc|back|environment/i.test(c.label));
                    if (usbIdx >= 0) currentCamIndex = usbIdx;
                }

                const chosenCam = specificDeviceId
                    ? cameraList.find(c => c.deviceId === specificDeviceId)
                    : cameraList[currentCamIndex];

                // ลองขอสิทธิ์กล้องจากเจาะจงไปหาทั่วไป (ไม่บังคับ exact facingMode ที่ทำให้ PC พัง)
                const tryConstraints = [];
                if (chosenCam && chosenCam.deviceId) {
                    tryConstraints.push({ video: { deviceId: { exact: chosenCam.deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
                    tryConstraints.push({ video: { deviceId: { exact: chosenCam.deviceId } }, audio: false });
                }
                tryConstraints.push({ video: { width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
                tryConstraints.push({ video: true, audio: false });

                let stream = null;
                let lastErr = null;
                for (const c of tryConstraints) {
                    try {
                        stream = await navigator.mediaDevices.getUserMedia(c);
                        if (stream) break;
                    } catch (e) {
                        lastErr = e;
                    }
                }

                if (!stream) throw lastErr || new Error('ไม่สามารถเข้าถึงกล้องได้');

                // อัปเดตรายชื่อกล้องอีกครั้งหลังได้สิทธิ์ (เพื่อให้เห็นชื่อรุ่นกล้องครบ)
                const updatedDevices = await navigator.mediaDevices.enumerateDevices();
                cameraList = updatedDevices.filter(d => d.kind === 'videoinput');

                currentStream = stream;
                video.srcObject = stream;

                // รอให้เฟรมภาพพร้อมก่อนสั่ง play() ป้องกัน AbortError
                await new Promise((resolve) => {
                    if (video.readyState >= 1) return resolve();
                    video.onloadedmetadata = () => resolve();
                });
                await video.play();

                // กลับด้านอัตโนมัติถ้าเป็นกล้องหน้า
                const activeTrack = stream.getVideoTracks()[0];
                const trackLabel = activeTrack ? activeTrack.label : '';
                isMirrored = /front|user|integrated/i.test(trackLabel);
                document.getElementById('videoWrapper').classList.toggle('mirror-mode', isMirrored);

                document.getElementById('cameraPlaceholderBox').classList.add('hidden');
                document.getElementById('videoWrapper').classList.remove('hidden');
                btnText.innerText = 'ปิดกล้อง';
                document.getElementById('btnStartCamera').className = 'flex-1 bg-rose-600 hover:bg-rose-500 text-white font-extrabold py-3.5 px-4 rounded-2xl text-sm flex items-center justify-center gap-2 shadow-lg cursor-pointer transition';

                startAiDetectionLoop();
            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error('AI Gate Camera Error:', err);
                    errText.innerText = `ไม่สามารถเปิดกล้องได้ (${err.message || err.name})`;
                    document.getElementById('cameraPlaceholderBox').classList.remove('hidden');
                    btnText.innerText = 'เปิดกล้อง AI';
                }
            } finally {
                isStartingCam = false;
            }
        }

        window.switchNextCamera = async function() {
            if (cameraList.length <= 1) {
                isMirrored = !isMirrored;
                document.getElementById('videoWrapper').classList.toggle('mirror-mode', isMirrored);
                return;
            }
            currentCamIndex = (currentCamIndex + 1) % cameraList.length;
            const nextId = cameraList[currentCamIndex].deviceId;
            if (currentStream) {
                currentStream.getTracks().forEach(t => t.stop());
                currentStream = null;
            }
            await startCameraSafe(nextId);
        };

        // 5. ตรวจจับใบหน้า + QR Code และบันทึกลง Supabase
        function startAiDetectionLoop() {
            const video = document.getElementById('gateVideo');
            const canvas = document.getElementById('gateCanvas');
            const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.45 });
            const qrReader = ('BarcodeDetector' in window) ? new BarcodeDetector({ formats: ['qr_code', 'code_128'] }) : null;

            detectTimer = setInterval(async () => {
                if (!video || video.paused || video.readyState < 2) return;

                // อ่าน QR Code บัตรนักเรียน
                if (qrReader) {
                    try {
                        const codes = await qrReader.detect(video);
                        if (codes && codes.length > 0 && codes[0].rawValue) {
                            await processStudentCheckIn(codes[0].rawValue.trim(), 'QR Code');
                        }
                    } catch (e) {}
                }

                // ตรวจจับใบหน้า
                if (!isModelsReady || video.videoWidth === 0) return;
                const size = { width: video.videoWidth, height: video.videoHeight };
                faceapi.matchDimensions(canvas, size);

                const detections = await faceapi
                    .detectAllFaces(video, options)
                    .withFaceLandmarks(true)
                    .withFaceDescriptors();

                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const resized = faceapi.resizeResults(detections, size);
                for (const det of resized) {
                    const box = det.detection.box;
                    let text = 'กำลังตรวจจับใบหน้า...';
                    let color = '#fbbf24';

                    if (faceMatcher) {
                        const match = faceMatcher.findBestMatch(det.descriptor);
                        if (match && match.label !== 'unknown') {
                            const stu = findStudentById(match.label);
                            const name = formatStudentName(stu) || match.label;
                            text = `${name} (${Math.round((1 - match.distance) * 100)}%)`;
                            color = '#34d399';
                            await processStudentCheckIn(match.label, 'Face AI');
                        } else {
                            text = 'ไม่พบข้อมูลใบหน้า (สแกนบัตร/พิมพ์รหัส)';
                            color = '#f43f5e';
                        }
                    }

                    ctx.strokeStyle = color;
                    ctx.lineWidth = 3;
                    ctx.strokeRect(box.x, box.y, box.width, box.height);
                }
            }, 450);
        }

        function findStudentById(id) {
            const cleanId = String(id).trim();
            return allStudents.find(s =>
                String(s.student_id || '').trim() === cleanId ||
                String(s.student_code || '').trim() === cleanId
            );
        }

        function formatStudentName(stu) {
            if (!stu) return '';
            return `${stu.prefix || ''}${stu.first_name || ''} ${stu.last_name || ''}`.trim() || stu.name || '';
        }

        async function processStudentCheckIn(rawId, method) {
            const sid = String(rawId).trim();
            if (!sid) return;

            const now = Date.now();
            if (recentCheckMap.has(sid) && (now - recentCheckMap.get(sid)) < 8000) return;
            recentCheckMap.set(sid, now);

            const stu = findStudentById(sid);
            if (!stu) {
                showToast(`❌ ไม่พบรหัสนักเรียน "${sid}" ในฐานข้อมูล`, 'กรุณาตรวจสอบรหัสนักเรียนอีกครั้ง', false);
                return;
            }

            const fullName = formatStudentName(stu);
            const room = stu.classroom || stu.class_room || '-';
            const timeStr = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const todayStr = new Date().toISOString().split('T')[0];

            showToast(`✅ ${fullName} (${room})`, `รหัส ${sid} • เช็คชื่อสำเร็จเวลา ${timeStr} น. [${method}]`, true);

            if (db) {
                try {
                    await db.from('attendance_records').insert([{
                        student_id: sid,
                        student_code: sid,
                        student_name: fullName,
                        classroom: room,
                        subject_code: 'GATE',
                        subject_name: 'สแกนประตูโรงเรียน',
                        date: todayStr,
                        status: 'present',
                        scan_method: method
                    }]);
                } catch (e) {}
            }
        }

        window.handleManualSubmit = async function(e) {
            e.preventDefault();
            const inp = document.getElementById('manualCodeInput');
            const val = inp.value.trim();
            if (!val) return;
            await processStudentCheckIn(val, 'พิมพ์รหัส');
            inp.value = '';
        };

        function showToast(title, detail, isOk) {
            const box = document.getElementById('scanResultToast');
            box.className = isOk
                ? 'absolute bottom-4 inset-x-4 z-20 bg-emerald-950/95 border-2 border-emerald-400 rounded-2xl p-3 text-center shadow-2xl'
                : 'absolute bottom-4 inset-x-4 z-20 bg-rose-950/95 border-2 border-rose-500 rounded-2xl p-3 text-center shadow-2xl';
            document.getElementById('toastName').innerText = title;
            document.getElementById('toastDetail').innerText = detail;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 4500);
        }

        // Modal เลือกห้องเรียน
        window.openRoomModal = () => document.getElementById('roomSelectModal').classList.remove('hidden');
        window.closeRoomModal = () => document.getElementById('roomSelectModal').classList.add('hidden');
        window.selectClassroom = async function(room) {
            selectedRoom = room;
            document.getElementById('selectedRoomText').innerText = room === 'ALL' ? 'ทุกห้อง' : room;
            window.closeRoomModal();
            await buildFaceMatcherForRoom(room);
        };

        document.addEventListener('DOMContentLoaded', async () => {
            await initAiModels();
            await loadRealStudentsFromSupabase();
        });
    </script>
</body>
</html>
